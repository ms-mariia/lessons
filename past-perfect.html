<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewind: Past Perfect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<!--
  ===================================================================
  LESSON TEMPLATE
  To make a new lesson: copy this file and edit ONLY the LESSON object
  in the first <script> (title, theme colours, sections).
  Emoji: put a name like "laptop" to use assets/emoji/laptop.png,
  or a normal emoji character.
  ===================================================================
-->

<style>
  :root{
    --bg:#F3F4FA; --paper:#FFFFFF; --ink:#14152B; --muted:#6B6E8A;
    --accent:#5B5BF7; --accent2:#FF4F9A; --soft:#E7E8FF;
    --r:#FF4D6D; --g:#22C993; --b:#4D7CFF;
    --ok:#14A374; --ok-bg:#E0F7EE; --bad:#E5484D; --bad-bg:#FDE7E8;
    --close:#B07A06; --close-bg:#FFF3D6;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --head:"Space Grotesk","DM Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);font:17px/1.6 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);
    background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1px,transparent 1.2px);
    background-size:22px 22px}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  button{font:inherit}
  img.emo{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}

  /* RGB stripe */
  .rgb{display:flex;height:8px}
  .rgb i{flex:1}.rgb i:nth-child(1){background:var(--r)}.rgb i:nth-child(2){background:var(--g)}.rgb i:nth-child(3){background:var(--b)}

  /* hero */
  .hero{position:relative;padding:44px 0 16px}
  .kicker{display:inline-block;font:700 12.5px/1.5 var(--mono);letter-spacing:.02em;color:var(--accent);background:var(--paper);border:1.5px solid var(--ink);padding:5px 12px;border-radius:8px;max-width:calc(100% - 90px)}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(46px,10vw,84px);line-height:.95;margin:18px 0 0;letter-spacing:-.035em}
  h1 .cur{display:inline-block;width:.09em;height:.82em;margin-left:.08em;background:var(--accent2);vertical-align:-.04em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  h1 .glitch{background:linear-gradient(90deg,var(--r),var(--g) 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin:18px 0 0;max-width:52ch;font-size:18px}
  .sticker{position:absolute;user-select:none;-webkit-user-select:none;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(20,21,43,.18))}
  .sticker img{width:100%;height:100%;display:block}
  .s1{right:0;top:30px;width:96px;height:96px;rotate:10deg}
  .s2{right:92px;top:120px;width:60px;height:60px;rotate:-12deg;animation-delay:-2.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}

  /* progress */
  .progress{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 0;font:700 13.5px var(--mono);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .progress .lbl{color:var(--muted)}
  .bar{flex:1;height:12px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--r),var(--g),var(--b));transition:width .6s cubic-bezier(.3,1.4,.5,1)}

  /* part divider */
  .part{display:flex;align-items:center;gap:14px;margin:56px 0 6px}
  .part .pi{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:40px}
  .part .pi img{width:54px;height:54px}
  .part .pn{font:700 13px var(--mono);letter-spacing:.08em;color:var(--pc,var(--accent))}
  .part h2{font-family:var(--head);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
  .part p{margin:2px 0 0;color:var(--muted);font-size:15.5px}

  /* window cards */
  .card{position:relative;background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;margin:26px 0;box-shadow:6px 6px 0 var(--ink);overflow:visible}
  .winbar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1.5px solid var(--ink);background:color-mix(in srgb,var(--soft) 55%,#fff);border-radius:16.5px 16.5px 0 0}
  .winbar i{width:11px;height:11px;border-radius:50%;border:1.3px solid var(--ink)}
  .winbar i:nth-child(1){background:var(--r)}.winbar i:nth-child(2){background:#FFC53D}.winbar i:nth-child(3){background:var(--g)}
  .winbar span{margin-left:8px;font:700 11.5px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .card-in{padding:20px 22px 18px}
  .deco{position:absolute;right:16px;top:-26px;width:52px;height:52px;rotate:10deg;user-select:none;font-size:40px;line-height:52px;text-align:center;filter:drop-shadow(0 6px 8px rgba(20,21,43,.18))}
  .deco img{width:100%;height:100%}
  .card-head{display:flex;align-items:flex-start;gap:12px}
  .ticket{flex:none;min-width:44px;height:34px;display:grid;place-items:center;padding:0 9px;background:var(--ink);color:var(--paper);font:700 15px var(--mono);border-radius:8px}
  .ticket.alt{background:var(--accent2)}
  h2.t{font-family:var(--head);font-weight:700;font-size:23px;line-height:1.2;margin:2px 0 0;letter-spacing:-.01em}
  .instr{color:var(--muted);margin:8px 0 18px;font-size:15.5px}
  .instr b{color:var(--ink)}

  .card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
  .btn{font-weight:700;font-size:15px;border-radius:10px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);transition:transform .12s,box-shadow .12s;box-shadow:3px 3px 0 var(--ink)}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn-check{background:var(--accent);color:#fff}
  .btn-soft{background:var(--soft)}
  .score{margin-left:auto;font:700 17px var(--mono)}
  .score.perfect{color:var(--ok)}
  .wiggle{animation:wiggle .5s}
  @keyframes wiggle{25%{rotate:-4deg}50%{rotate:4deg}75%{rotate:-2deg}}

  /* theory blocks */
  .rule p{margin:0 0 12px}
  .rule h3{font-family:var(--head);font-size:18px;margin:22px 0 8px}
  .rule h3:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .box{border-radius:12px;padding:12px 14px;background:var(--soft);border:1.5px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  .box.pink{background:color-mix(in srgb,var(--accent2) 13%,#fff)}
  .box.green{background:color-mix(in srgb,var(--g) 14%,#fff)}
  .box h4{margin:0 0 4px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .box p{margin:0;font-size:15.5px}
  .formula{font:700 clamp(18px,3.6vw,24px) var(--mono);text-align:center;padding:16px 10px;margin:12px 0;border:1.5px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,#fff)}
  .formula .h{color:var(--accent2)}.formula .v{color:var(--accent)}
  table.form{width:100%;border-collapse:collapse;font-size:15.5px;margin:10px 0 4px}
  table.form th,table.form td{border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding:8px 8px;text-align:left;vertical-align:top}
  table.form th{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .hl{background:color-mix(in srgb,var(--accent2) 22%,transparent);border-radius:4px;padding:0 3px;font-weight:700}
  .hl2{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 3px;font-weight:700}
  .note{margin-top:14px;font-size:15px;background:var(--close-bg);border-radius:12px;padding:10px 14px}
  .notes-tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;background:color-mix(in srgb,var(--g) 13%,#fff);border-radius:12px;padding:10px 14px}
  .notes-tip img{width:30px;height:30px;flex:none}
  .cat{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px 10px;margin:14px 0;background:#fff}
  .cat .tag{display:inline-block;font:700 12px var(--mono);background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;margin-bottom:6px}
  .cat p{margin:4px 0}
  .ex{font-style:italic}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chips span{font:700 13.5px var(--mono);border:1.5px solid var(--ink);border-radius:8px;padding:3px 10px;background:#fff}
  .story{font-size:17.5px;line-height:1.8;background:color-mix(in srgb,var(--soft) 45%,#fff);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 18px;margin:8px 0 14px}
  ol.qs{margin:0 0 6px;padding-left:1.4em}
  ol.qs li{margin:0 0 6px}
  details{margin-top:12px;border:1.5px solid var(--ink);border-radius:12px;background:#fff}
  details summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  details > div{padding:0 14px 12px}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}}

  /* timelines */
  .tl{position:relative;height:104px;margin:10px 4px 6px}
  .tl::before{content:"";position:absolute;left:0;right:12px;top:52px;height:3px;background:var(--ink);border-radius:3px}
  .tl::after{content:"";position:absolute;right:0;top:46.5px;border-left:13px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
  .tl .now{position:absolute;right:30px;top:44px;width:3px;height:19px;background:var(--muted);border-radius:2px}
  .tl .now::after{content:"now";position:absolute;top:22px;left:50%;translate:-50% 0;font:700 11.5px var(--mono);color:var(--muted)}
  .tl .pt{position:absolute;left:var(--x);top:43px;width:21px;height:21px;margin-left:-10.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--ink)}
  .tl .pt.e{background:var(--accent2)}
  .tl .pt b,.tl .mk b,.tl .sp b{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;font:700 13px var(--mono);bottom:30px}
  .tl .pt i,.tl .mk i,.tl .sp i{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;font:500 12px var(--mono);color:var(--muted);font-style:normal;top:30px}
  .tl .pt.e b{color:var(--accent2)} .tl .pt b{color:var(--accent)}
  .tl .mk{position:absolute;left:var(--x);top:24px;height:58px;border-left:2.5px dashed var(--accent)}
  .tl .mk b{bottom:auto;top:-22px;color:var(--accent)} .tl .mk i{top:60px}
  .tl .sp{position:absolute;left:var(--x);width:var(--w);top:47px;height:13px;border-radius:7px;background:color-mix(in srgb,var(--accent2) 60%,#fff);border:1.5px solid var(--ink)}
  .tl .sp b{color:var(--accent2)}
  .tl .arc{position:absolute;left:var(--x);width:var(--w);top:6px;height:30px;border:2px dashed var(--muted);border-bottom:0;border-radius:40px 40px 0 0}
  .tl .arc::before{content:"";position:absolute;left:-7px;bottom:-4px;border-top:9px solid var(--muted);border-left:6px solid transparent;border-right:6px solid transparent}
  .tl.big{height:122px}
  .tl.big::before{top:66px}.tl.big::after{top:60.5px}.tl.big .now{top:58px}.tl.big .pt{top:57px}.tl.big .arc{top:12px;height:40px}
  .tl .arc span{position:absolute;top:-13px;left:50%;translate:-50% 0;background:var(--paper);padding:0 6px;font:700 11px var(--mono);color:var(--muted);white-space:nowrap}
  @media (max-width:520px){.tl .pt b,.tl .mk b,.tl .sp b{font-size:11.5px}.tl .pt i,.tl .mk i,.tl .sp i{font-size:10.5px}}

  /* gap fill */
  .lines{margin:0;padding-left:1.6em}
  .lines li::marker{color:var(--accent);font:700 14px var(--mono)}
  .line{margin:0 0 4px;line-height:2.4}
  .para .line{line-height:2.5}
  .gapwrap{white-space:nowrap}
  .gap{font:inherit;font-size:16.5px;color:var(--ink);border:0;border-bottom:2.5px solid var(--accent);background:var(--soft);border-radius:7px 7px 2px 2px;padding:1px 8px;min-width:5ch;max-width:100%;text-align:center;outline:none;transition:background .15s,box-shadow .15s}
  .gap:focus{background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
  .hint{color:var(--muted);font:500 .8em var(--mono);margin-left:5px}
  input.ok,textarea.ok{background:var(--ok-bg);border-color:var(--ok);color:#0f5f45}
  input.bad{background:var(--bad-bg);border-color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:4px}
  input.close{background:var(--close-bg);border-color:var(--close)}
  .reveal{display:inline-block;margin-left:6px;font-size:.84em;font-weight:700;color:#0f5f45;background:var(--ok-bg);padding:0 9px;border-radius:99px;line-height:1.9;white-space:nowrap}

  /* multiple choice */
  .q{margin:0 0 18px}
  .q-text{margin-bottom:8px}
  .q-num{font:700 14px var(--mono);color:var(--accent);margin-right:8px}
  .blank{display:inline-block;width:60px;border-bottom:2px solid var(--muted);margin:0 3px;translate:0 -4px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-size:15.5px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;transition:transform .12s,background .15s;text-align:left}
  .opt:hover{transform:translateY(-1px)}
  .opt.sel{background:var(--ink);color:#fff}
  .opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.answer{box-shadow:0 0 0 3px var(--ok)}
  .tf .q{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;margin:0;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
  .tf .q-text{margin:0}
  .tf .opts{flex:none;flex-wrap:nowrap}
  @media (max-width:560px){.tf .q{flex-direction:column;align-items:flex-start;gap:8px}}

  /* drag & drop */
  .bank{display:flex;flex-wrap:wrap;gap:9px;padding:12px;min-height:60px;margin-bottom:18px;border:1.5px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:14px;background:color-mix(in srgb,var(--soft) 40%,#fff);transition:background .15s}
  .bank:empty::before{content:"All placed ✨";color:var(--muted);font-size:14px;align-self:center}
  .bank.over{background:var(--soft)}
  .chip{font-size:15px;font-weight:700;line-height:1.35;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;padding:5px 11px;box-shadow:2px 2px 0 var(--accent);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:left}
  .chip.selected{outline:3px solid var(--accent2);outline-offset:2px;rotate:-2deg}
  .chip.dragging{opacity:.28}
  .chip.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;rotate:-4deg;scale:1.05;box-shadow:5px 6px 0 var(--accent)}
  .chip.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:none}
  .chip.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:none}
  .slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:40px;padding:2px;margin:0 4px;vertical-align:middle;border:1.5px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-radius:11px;cursor:pointer;transition:background .15s,border-color .15s}
  .slot .chip{box-shadow:none}
  .slot.over,.bucket-zone.over{background:var(--soft);border-color:var(--accent)}
  .slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
  .slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
  .slot.ok .chip,.slot.bad .chip{background:transparent;border-color:transparent}
  .match{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;align-items:center}
  .mrow .left{font-weight:500}
  .mrow .left::before{content:attr(data-n);font:700 14px var(--mono);color:var(--accent);margin-right:8px}
  .mrow .slot{display:flex;justify-content:flex-start;width:100%;min-height:46px;margin:0}
  @media (max-width:560px){.mrow{grid-template-columns:1fr;gap:6px}.mrow+.mrow{margin-top:8px}}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .bucket{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
  .bucket h3{margin:0;padding:8px 12px;font-size:15px;background:var(--soft);border-bottom:1.5px solid var(--ink)}
  .bucket-zone{min-height:118px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:background .15s}

  /* full-width inputs */
  .row{margin:0 0 16px}
  .row-label{font-size:14.5px;color:var(--muted);margin-bottom:5px}
  .row-label s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
  .prompt{font-weight:500;margin-bottom:6px}
  .prompt .num{font:700 14px var(--mono);color:var(--accent);margin-right:6px}
  .key{display:inline-block;font:700 12.5px var(--mono);background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px;margin-left:6px}
  .full{display:block;width:100%;font:inherit;font-size:16.5px;color:var(--ink);padding:10px 14px;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:11px;background:#fff;outline:none;transition:border-color .15s,background .15s}
  .full:focus{border-color:var(--accent)}
  textarea.full{resize:vertical;min-height:150px;line-height:1.55}
  .model{margin-top:7px;font-size:15px;color:#0f5f45;background:var(--ok-bg);padding:7px 12px;border-radius:10px}
  .model.close{color:#7a5300;background:var(--close-bg)}
  .model.warn{color:#8a2b2e;background:var(--bad-bg)}
  .checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:15px}
  .checks li::before{content:"○";display:inline-block;width:1.4em;font-weight:800;color:var(--muted)}
  .checks li.done::before{content:"✓";color:var(--ok)}
  .checks li.done{color:#0f5f45}
  .wordbox{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .wordbox span{font:700 13px var(--mono);background:var(--soft);border-radius:6px;padding:2px 8px}
  .wordbox span.used{background:var(--ok-bg);color:#0f5f45;text-decoration:line-through}

  .page-foot{text-align:center;padding:24px 0 70px;color:var(--muted);font-size:14px}
  .page-foot .btn{margin-bottom:14px}
  .page-foot small{display:block;margin-top:8px;font-size:12px;opacity:.8}

  .confetti{position:fixed;z-index:999;pointer-events:none;font-size:22px;left:0;top:0;width:28px;height:28px}
  .confetti img{width:100%;height:100%}

  @media (max-width:560px){
    body{font-size:16.5px}
    .card-in{padding:18px 15px 15px}
    .card{box-shadow:4px 4px 0 var(--ink)}
    .s1{width:72px;height:72px;top:24px}
    .s2{display:none}
    .score{width:100%;margin-left:0;order:-1}
    .deco{width:44px;height:44px;top:-20px}
    .gapwrap{white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="rgb" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header class="hero">
    <div class="sticker s1" id="sticker1" aria-hidden="true"></div>
    <div class="sticker s2" id="sticker2" aria-hidden="true"></div>
    <span class="kicker" id="kicker"></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="progress" aria-live="polite">
    <span class="lbl">progress</span><span><b id="pScore">0</b>/<b id="pTotal">0</b></span>

<script>
/* =====================================================================

(function(){
"use strict";

/* ---------- helpers ---------- */
function h(tag, props){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);

    const kids = [].concat(arguments[i]);
    for (const kid of kids){
      if (kid == null || kid === false) continue;

}
function clear(obj){ for (const k of Object.keys(obj)) delete obj[k]; }
function emo(x, cls){
  if (!x) return "";
  if (/^[a-z0-9-]+$/.test(x)) return h("img", { src: "assets/emoji/" + x + ".png", alt: "", class: cls || "", draggable: "false" });
  return document.createTextNode(x);
}

function norm(s, dWord){
  s = String(s || "").toLowerCase()
    .replace(/[’‘`´]/g, "'").replace(/[“”"«»]/g, "");
  s = s.replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "cannot").replace(/\bcan not\b/g, "cannot")
       .replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are")
       .replace(/'ve\b/g, " have").replace(/'ll\b/g, " will").replace(/'d\b/g, " " + (dWord || "had"));
  s = s.replace(/\b(he|she|it|what|who|there|that)'s\b/g, "$1 is");
  s = s.replace(/\bmom\b/g, "mum").replace(/\bo'clock\b/g, "oclock");
  s = s.replace(/[.,!?;:()\[\]–—-]/g, " ").replace(/\s+/g, " ").trim();

function matches(value, answers){

  for (const w of A){ const i = pool.indexOf(w); if (i > -1){ hit++; pool.splice(i,1); } }
  return hit / Math.max(A.length, B.length);
}
function parseGaps(str){
  const parts = []; const re = /\[\[(.+?)\]\]/g; let last = 0, m;
  while ((m = re.exec(str))){
    if (m.index > last) parts.push({ text: str.slice(last, m.index) });
    const [ans, hint] = m[1].split(" // ");
    parts.push({ answers: ans.split("|").map(s => s.trim()), hint: hint ? hint.trim() : null });
    last = re.lastIndex;

}
function hashStr(s){ let h1 = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ h1 = Math.imul(h1 ^ s.charCodeAt(i), 3432918353); h1 = h1 << 13 | h1 >>> 19; } return h1 >>> 0; }

}
function addReveal(container, text){
  if (container.querySelector(":scope > .reveal")) return;
  container.append(h("span", { class: "reveal" }, "→ " + text));
}
function removeReveals(root){ root.querySelectorAll(".reveal, .model").forEach(n => n.remove()); }
function fire(el){ el.dispatchEvent(new Event("input", { bubbles: true })); }

/* ---------- storage ---------- */
const KEY = "lesson:" + LESSON.id;
let SAVE = {};
try { SAVE = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { SAVE = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch (e) {} }

/* ---------- theme & header ---------- */
const root = document.documentElement;
for (const k in (LESSON.theme || {})) root.style.setProperty("--" + k, LESSON.theme[k]);
document.title = LESSON.title;
document.getElementById("kicker").textContent = LESSON.kicker || "";
const t = document.getElementById("title");
if (LESSON.titleHTML) t.innerHTML = LESSON.titleHTML; else t.textContent = LESSON.title;
document.getElementById("sub").textContent = LESSON.subtitle || "";
const st = LESSON.stickers || [];
document.getElementById("sticker1").append(emo(st[0]));
document.getElementById("sticker2").append(emo(st[1]));

/* ---------- confetti ---------- */
function burst(fromEl){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = fromEl.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const set = LESSON.confetti && LESSON.confetti.length ? LESSON.confetti : ["⭐"];
  for (let i = 0; i < 16; i++){
    const s = h("span", { class: "confetti" }, emo(set[i % set.length]));
    document.body.append(s);
    const dx = (Math.random() - .5) * 360, dy = -60 - Math.random() * 230, rot = (Math.random() - .5) * 540;
    const anim = s.animate([
      { transform: `translate(${cx}px, ${cy}px) scale(.5)`, opacity: 1 },
      { transform: `translate(${cx + dx * .6}px, ${cy + dy}px) rotate(${rot / 2}deg) scale(1.1)`, opacity: 1, offset: .55 },
      { transform: `translate(${cx + dx}px, ${cy + dy + 170}px) rotate(${rot}deg) scale(.9)`, opacity: 0 }
    ], { duration: 1150 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.4,1)" });
    anim.onfinish = () => s.remove();
  }
}

/* ---------- drag & drop board (mouse + touch + tap) ---------- */
function Board(scope, v){
  const zones = {}, chips = {}; let selected = null;
  const bank = h("div", { class: "bank" });
  register(bank, "bank", false);
  function register(el, id, single){
    el.dataset.zone = id; zones[id] = { el, single };
    el.addEventListener("click", () => { if (selected) place(selected, id); });
  }
  function zoneOf(c){ const p = c.parentElement; return p && p.dataset.zone ? p.dataset.zone : "bank"; }
  function unselect(){ if (selected) selected.classList.remove("selected"); selected = null; }
  function clearMarks(){ scope.querySelectorAll(".ok,.bad").forEach(n => n.classList.remove("ok", "bad")); }
  function place(c, zid, silent){
    const z = zones[zid]; if (!z) return;
    if (z.single) z.el.querySelectorAll(".chip").forEach(o => { if (o !== c) bank.append(o); });
    z.el.append(c); unselect();
    if (!silent){ clearMarks(); for (const id in chips){ const zz = zoneOf(chips[id]); if (zz === "bank") delete v[id]; else v[id] = zz; } persist(); fire(scope); }

    const c = h("button", { class: "chip", type: "button", html: label });
    c.dataset.id = id; c.dataset.value = value; chips[id] = c;
    let d = null;
    c.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      d = { x: e.clientX, y: e.clientY, moved: false, ghost: null };
      try { c.setPointerCapture(e.pointerId); } catch (_) {}
    });
    c.addEventListener("pointermove", e => {
      if (!d) return;

  }

  return { bank, register, chip, place, restore, resetAll, chips, zones, zoneOf };
}

/* ---------- renderers ---------- */
const RENDER = {};
const LABEL = { rule: "theory", mcq: "multiple choice", tf: "true / false", gapfill: "gap fill", dragwords: "drag & drop", match: "match", sort: "sort", correct: "correct the mistakes", rephrase: "rewrite", translate: "translate", open: "your ideas", write: "writing" };

RENDER.rule = (sec, s, body) => { body.append(h("div", { class: "rule", html: sec.html })); return null; };

function mcqCore(sec, s, body, items){
  const v = s.v || (s.v = {}); const qs = [];
  items.forEach((it, i) => {
    const q = h("div", { class: "q" });
    const text = h("div", { class: "q-text" }, h("span", { class: "q-num" }, String(i + 1).padStart(2, "0")));
    it.q.split("___").forEach((part, k) => { if (k) text.append(h("span", { class: "blank" })); text.append(h("span", { html: part })); });
    const opts = h("div", { class: "opts", role: "radiogroup" });
    const btns = it.options.map((o, j) => {
      const b = h("button", { class: "opt", type: "button", role: "radio", html: o });
      b.addEventListener("click", () => { v[i] = j; persist(); paint(); fire(body); });
      opts.append(b); return b;
    });
    function paint(){ btns.forEach((b, j) => { b.classList.toggle("sel", v[i] === j); b.classList.remove("ok", "bad", "answer"); b.setAttribute("aria-checked", v[i] === j); }); }
    paint(); q.append(text, opts); body.append(q);

  });

    total: qs.length,
    check(){ let sc = 0; qs.forEach(({ it, btns, i }) => {
      btns.forEach(b => b.classList.remove("ok", "bad"));
      if (v[i] === undefined) return;
      const ok = v[i] === it.answer; btns[v[i]].classList.add(ok ? "ok" : "bad"); if (ok) sc++;

    reveal(){ qs.forEach(({ it, btns, i }) => { if (v[i] !== it.answer) btns[it.answer].classList.add("answer"); }); },
    reset(){ clear(v); qs.forEach(({ btns }) => btns.forEach(b => b.classList.remove("sel", "ok", "bad", "answer"))); }
  };
}
RENDER.mcq = (sec, s, body) => mcqCore(sec, s, body, sec.items);
RENDER.tf = (sec, s, body) => { body.classList.add("tf"); return mcqCore(sec, s, body, sec.items.map(it => ({ q: it.q, options: ["True", "False"], answer: it.answer ? 0 : 1 }))); };

RENDER.gapfill = (sec, s, body) => {
  const v = s.v || (s.v = {}); const gaps = [];
  const isList = Array.isArray(sec.items);
  const items = isList ? sec.items : [sec.text];
  const list = h(isList ? "ol" : "div", { class: isList ? "lines" : "para story" });
  items.forEach((it, i) => {
    const line = h(isList ? "li" : "p", { class: "line" });
    parseGaps(it).forEach((p, j) => {
      if (p.text != null){ line.append(h("span", { html: p.text })); return; }
      const key = i + "-" + j;
      const w = Math.max(5, ...p.answers.map(a => a.length)) + 2;
      const input = h("input", { class: "gap", type: "text", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false", "aria-label": p.hint ? "gap: " + p.hint : "gap", style: `width:${w}ch` });

      input.addEventListener("keydown", e => {
        if (e.key !== "Enter") return; e.preventDefault();

        if (n) n.focus(); else input.blur();

      if (p.hint) wrap.append(h("span", { class: "hint" }, "(" + p.hint + ")"));

  });

    total: gaps.length,
    check(){ let sc = 0; gaps.forEach(g => { const ok = matches(g.input.value, g.answers); g.input.classList.toggle("ok", ok); g.input.classList.toggle("bad", !ok); if (ok) sc++; }); return sc; },
    reveal(){ gaps.forEach(g => { if (!g.input.classList.contains("ok")) addReveal(g.wrap, g.answers[0]); }); },
    reset(){ clear(v); gaps.forEach(g => { g.input.value = ""; g.input.classList.remove("ok", "bad"); }); }
  };
};

RENDER.dragwords = (sec, s, body) => {
  const v = s.v || (s.v = {}); const B = Board(body, v); const slots = []; const words = [];
  const list = h("ol", { class: "lines" });
  sec.items.forEach((it, i) => {
    const line = h("li", { class: "line" });
    parseGaps(it).forEach((p, j) => {
      if (p.text != null){ line.append(h("span", { html: p.text })); return; }
      const slot = h("span", { class: "slot", role: "button", "aria-label": "drop zone" });
      B.register(slot, "g" + i + "-" + j, true);
      slots.push({ slot, answers: p.answers }); words.push(p.answers[0]); line.append(slot);
    });
    list.append(line);
  });
  (sec.extra || []).forEach(w => words.push(w));
  shuffle(words.map((w, k) => ({ id: "c" + k, w })), LESSON.id + sec.title).forEach(o => B.chip(o.id, o.w, o.w));
  body.append(B.bank, list); B.restore();
  return {
    total: slots.length,
    check(){ let sc = 0; slots.forEach(o => {
      const c = o.slot.querySelector(".chip"); const ok = !!c && matches(c.dataset.value, o.answers);
      o.slot.classList.toggle("ok", ok); o.slot.classList.toggle("bad", !ok); if (ok) sc++;
    }); return sc; },
    reveal(){
      B.resetAll(); const used = new Set();
      slots.forEach(o => { const c = Object.values(B.chips).find(ch => !used.has(ch) && matches(ch.dataset.value, o.answers));
        if (c){ used.add(c); B.place(c, o.slot.dataset.zone); } });
    },
    reset(){ B.resetAll(); persist(); }
  };
};

RENDER.match = (sec, s, body) => {
  const v = s.v || (s.v = {}); const B = Board(body, v); const rows = [];
  const grid = h("div", { class: "match" });
  sec.pairs.forEach((p, i) => {
    const slot = h("div", { class: "slot", role: "button", "aria-label": "drop zone" });
    B.register(slot, "m" + i, true);
    grid.append(h("div", { class: "mrow" }, h("div", { class: "left", "data-n": String(i + 1).padStart(2, "0"), html: p[0] }), slot));
    rows.push(slot);
  });
  shuffle(sec.pairs.map((p, i) => i), LESSON.id + sec.title).forEach(i => B.chip("r" + i, sec.pairs[i][1], String(i)));
  body.append(B.bank, grid); B.restore();
  return {
    total: rows.length,
    check(){ let sc = 0; rows.forEach((slot, i) => { const c = slot.querySelector(".chip"); const ok = !!c && c.dataset.value === String(i);
      slot.classList.toggle("ok", ok); slot.classList.toggle("bad", !ok); if (ok) sc++; }); return sc; },
    reveal(){ B.resetAll(); rows.forEach((slot, i) => B.place(B.chips["r" + i], "m" + i)); },
    reset(){ B.resetAll(); persist(); }
  };
};

RENDER.sort = (sec, s, body) => {
  const v = s.v || (s.v = {}); const B = Board(body, v);
  const wrap = h("div", { class: "buckets" }); const all = [];
  sec.categories.forEach((cat, ci) => {
    const zone = h("div", { class: "bucket-zone" }); B.register(zone, "b" + ci, false);
    wrap.append(h("div", { class: "bucket" }, h("h3", { html: cat.name }), zone));
    cat.words.forEach((w, wi) => all.push({ id: "w" + ci + "-" + wi, w, ci }));
  });
  shuffle(all, LESSON.id + sec.title).forEach(o => B.chip(o.id, o.w, String(o.ci)));
  body.append(B.bank, wrap); B.restore();
  return {
    total: all.length,
    check(){ let sc = 0; Object.values(B.chips).forEach(c => { const z = B.zoneOf(c);
      const ok = z === "b" + c.dataset.value; c.classList.toggle("ok", ok); c.classList.toggle("bad", !ok && z !== "bank"); if (ok) sc++; }); return sc; },
    reveal(){ Object.values(B.chips).forEach(c => { if (B.zoneOf(c) !== "b" + c.dataset.value) B.place(c, "b" + c.dataset.value); }); },
    reset(){ B.resetAll(); persist(); }
  };
};

RENDER.correct = (sec, s, body) => {
  const v = s.v || (s.v = {}); const rows = [];
  sec.items.forEach((it, i) => {
    const input = h("input", { class: "full", type: "text", autocomplete: "off", autocapitalize: "sentences", spellcheck: "false", "aria-label": "corrected sentence " + (i + 1) });
    input.value = v[i] != null ? v[i] : it.wrong;
    input.addEventListener("input", () => { v[i] = input.value; persist(); input.classList.remove("ok", "bad"); });
    const row = h("div", { class: "row" }, h("div", { class: "row-label" }, h("span", { class: "num", style: "font:700 13px var(--mono);color:var(--accent);margin-right:6px" }, String(i + 1).padStart(2, "0")), h("s", {}, it.wrong)), input);
    body.append(row); rows.push({ it, input, row });
  });
  return {
    total: rows.length,
    check(){ let sc = 0; rows.forEach(r => { const ok = matches(r.input.value, r.it.answers); r.input.classList.toggle("ok", ok); r.input.classList.toggle("bad", !ok); if (ok) sc++; }); return sc; },
    reveal(){ rows.forEach(r => { if (!r.input.classList.contains("ok") && !r.row.querySelector(".model")) r.row.append(h("div", { class: "model" }, "✓ " + r.it.answers[0])); }); },
    reset(){ clear(v); rows.forEach(r => { r.input.value = r.it.wrong; r.input.classList.remove("ok", "bad"); }); }
  };
};

RENDER.rephrase = RENDER.translate = (sec, s, body) => {
  const v = s.v || (s.v = {}); const rows = [];
  sec.items.forEach((it, i) => {
    const input = h("input", { class: "full", type: "text", autocomplete: "off", autocapitalize: "sentences", spellcheck: "false", placeholder: "Type the full sentence…", "aria-label": "answer " + (i + 1) });
    input.value = v[i] || "";
    const prompt = h("div", { class: "prompt" }, h("span", { class: "num" }, String(i + 1).padStart(2, "0")), h("span", { html: it.prompt }));
    if (it.key) prompt.append(h("span", { class: "key" }, it.key));
    const row = h("div", { class: "row" }, prompt, input);
    input.addEventListener("input", () => { v[i] = input.value; persist(); input.classList.remove("ok", "bad", "close"); const m = row.querySelector(".model"); if (m) m.remove(); });
    body.append(row); rows.push({ it, input, row });
  });
  return {
    total: rows.length,
    check(){ let sc = 0; rows.forEach(r => {
      const old = r.row.querySelector(".model"); if (old) old.remove();
      r.input.classList.remove("ok", "bad", "close");
      if (matches(r.input.value, r.it.answers)){ r.input.classList.add("ok"); sc++; return; }
      const best = Math.max(...r.it.answers.map(a => similarity(r.input.value, a)));
      if (best >= .7){ r.input.classList.add("close"); r.row.append(h("div", { class: "model close" }, "Almost! Compare: " + r.it.answers[0])); }
      else r.input.classList.add("bad");
    }); return sc; },
    reveal(){ rows.forEach(r => { if (!r.input.classList.contains("ok") && !r.row.querySelector(".model")) r.row.append(h("div", { class: "model" }, "✓ " + r.it.answers[0])); }); },
    reset(){ clear(v); rows.forEach(r => { r.input.value = ""; r.input.classList.remove("ok", "bad", "close"); }); }
  };
};

RENDER.open = (sec, s, body) => {
  const v = s.v || (s.v = {}); const rows = [];
  sec.items.forEach((it, i) => {
    const input = h("input", { class: "full", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "true", placeholder: "…", "aria-label": it.prompt });
    input.value = v[i] || "";
    const row = h("div", { class: "row" }, h("div", { class: "prompt" }, h("span", { class: "num" }, String(i + 1).padStart(2, "0")), it.prompt), input);
    input.addEventListener("input", () => { v[i] = input.value; persist(); input.classList.remove("ok", "bad"); const m = row.querySelector(".model"); if (m) m.remove(); });
    body.append(row); rows.push({ it, input, row });
  });
  return {
    total: rows.length, revealLabel: "👀 Show examples",
    check(){ let sc = 0; rows.forEach(r => {
      const old = r.row.querySelector(".model"); if (old) old.remove();
      const txt = r.input.value.trim(); const long = txt.split(/\s+/).filter(Boolean).length >= 3;
      const okPattern = !r.it.pattern || new RegExp(r.it.pattern, "i").test(txt.replace(/[’‘]/g, "'"));
      const ok = long && okPattern;
      r.input.classList.toggle("ok", ok); r.input.classList.toggle("bad", !ok);
      if (!ok) r.row.append(h("div", { class: "model warn" }, !long ? "Write a bit more — at least three words." : "Try to use the Past Perfect (had + V3)."));
      if (ok) sc++;
    }); return sc; },
    reveal(){ rows.forEach(r => { const old = r.row.querySelector(".model"); if (old) old.remove(); r.row.append(h("div", { class: "model" }, "Example: " + r.it.sample)); }); },
    reset(){ clear(v); rows.forEach(r => { r.input.value = ""; r.input.classList.remove("ok", "bad"); }); }
  };
};

RENDER.write = (sec, s, body) => {
  const v = s.v || (s.v = {});
  let box = null;
  if (sec.words){ box = h("div", { class: "wordbox" }); sec.words.forEach(w => box.append(h("span", { "data-w": w }, w))); body.append(box); }
  const ta = h("textarea", { class: "full", rows: 7, spellcheck: "true", placeholder: "Write here…", "aria-label": "your text" });
  ta.value = v.text || "";
  const ul = h("ul", { class: "checks" });
  const lis = (sec.checks || []).map(c => { const li = h("li", {}, c.label); ul.append(li); return { c, li }; });
  body.append(ta, ul);
  function usedWords(t){ return (sec.words || []).filter(w => new RegExp("\\b" + w.replace(/\s+/g, "\\s+") + "\\w*", "i").test(t)); }
  function run(){ const tx = ta.value.replace(/[’‘]/g, "'");
    const used = usedWords(tx);
    if (box) box.querySelectorAll("span").forEach(sp => sp.classList.toggle("used", used.includes(sp.dataset.w)));
    lis.forEach(({ c, li }) => {
      let ok = false;
      if (c.pattern){ const n = (tx.match(new RegExp(c.pattern, "gi")) || []).length; ok = n >= (c.min || 1); }
      if (c.words) ok = used.length >= c.words;
      if (c.sentences) ok = tx.split(/[.!?]+|\n+/).filter(x => x.trim().split(/\s+/).length >= 3).length >= c.sentences;
      li.classList.toggle("done", ok);
    });
  }
  ta.addEventListener("input", () => { v.text = ta.value; persist(); run(); });
  run();
  return {
    total: 0, revealLabel: "See an example",
    check(){ run(); return null; },
    reveal(){ if (!body.querySelector(".model")) body.append(h("div", { class: "model" }, "Example: " + sec.sample)); },
    reset(){ clear(v); ta.value = ""; run(); }
  };
};

/* ---------- progress ---------- */
const graded = [];
function updateProgress(){
  let sc = 0, tot = 0;
  graded.forEach(g => { tot += g.api.total; if (g.s.score != null) sc += g.s.score; });
  document.getElementById("pScore").textContent = sc;
  document.getElementById("pTotal").textContent = tot;
  document.getElementById("pBar").style.width = tot ? (sc / tot * 100) + "%" : "0";
}

/* ---------- build ---------- */
const main = document.getElementById("lesson");
let n = 0;
LESSON.sections.forEach((sec, idx) => {
  if (sec.type === "part"){
    main.append(h("div", { class: "part", style: sec.color ? "--pc:" + sec.color : "" },
      h("div", { class: "pi" }, emo(sec.icon)),
      h("div", {}, h("div", { class: "pn" }, "PART " + sec.n), h("h2", {}, sec.title), sec.text ? h("p", {}, sec.text) : null)));
    return;
  }
  const sid = "s" + idx; const s = SAVE[sid] || (SAVE[sid] = {});
  const exercise = sec.type !== "rule";
  const card = h("section", { class: "card", id: sid });
  card.append(h("div", { class: "winbar", "aria-hidden": "true" }, h("i"), h("i"), h("i"), h("span", {}, sec.label || LABEL[sec.type] || "")));
  if (sec.sticker) card.append(h("div", { class: "deco", "aria-hidden": "true" }, emo(sec.sticker)));
  const inner = h("div", { class: "card-in" }); card.append(inner);
  const ticket = h("div", { class: "ticket" + (exercise ? "" : " alt") }, exercise ? String(++n).padStart(2, "0") : "i");
  inner.append(h("div", { class: "card-head" }, ticket, h("div", {}, h("h2", { class: "t", html: sec.title || "" }))));
  if (sec.instructions) inner.append(h("p", { class: "instr", html: sec.instructions }));
  else inner.append(h("div", { style: "height:14px" }));
  const body = h("div", { class: "card-body" }); inner.append(body);
  const api = RENDER[sec.type] ? RENDER[sec.type](sec, s, body) : null;
  main.append(card);
  if (!api) return;

  const score = h("span", { class: "score" });
  const btnCheck = h("button", { class: "btn btn-check", type: "button" }, "Check");
  const btnShow = h("button", { class: "btn btn-soft", type: "button", hidden: true }, api.revealLabel || "👀 Show answers");
  const btnReset = h("button", { class: "btn", type: "button" }, "Reset");
  inner.append(h("div", { class: "card-foot" }, btnCheck, btnShow, btnReset, score));

  function showScore(){
    if (!api.total || s.score == null){ score.textContent = ""; score.classList.remove("perfect"); return; }
    score.textContent = s.score + "/" + api.total + (s.score === api.total ? " ✓" : "");
    score.classList.toggle("perfect", s.score === api.total);
  }
  function doCheck(silent){
    const r = api.check(); s.checked = true;
    if (api.total) s.score = r;
    persist(); showScore(); updateProgress(); btnShow.hidden = false;
    if (!silent && api.total && r === api.total){ burst(btnCheck); btnCheck.classList.remove("wiggle"); void btnCheck.offsetWidth; btnCheck.classList.add("wiggle"); }
  }
  btnCheck.addEventListener("click", () => doCheck(false));
  let revealing = false;
  btnShow.addEventListener("click", () => { revealing = true; api.reveal(); revealing = false; });
  btnReset.addEventListener("click", () => {
    api.reset(); removeReveals(body);
    delete s.score; delete s.checked; persist();
    btnShow.hidden = true; showScore(); updateProgress();
  });
  body.addEventListener("input", () => { if (!revealing && s.score != null && api.total){ delete s.score; delete s.checked; persist(); showScore(); updateProgress(); } });

  if (api.total) graded.push({ api, s });
  if (s.checked) doCheck(true);
});
updateProgress();

document.getElementById("resetAll").addEventListener("click", () => {
  if (!confirm("Clear all your answers in this lesson?")) return;
  SAVE = {}; try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
});
})();
</script>
