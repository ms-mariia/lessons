<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Climate+Crisis&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- LESSON TEMPLATE: edit only the LESSON object. Emoji names → assets/emoji/<name>.png -->
<style>
  /* ===== Deep Dive · ocean theme ===== */
  :root{
    --surface:#0F6A86; --mid:#0A3556; --abyss:#041325;
    --paper:#F4FBFA; --ink:#0B2236; --muted:#5A7083; --line:rgba(11,34,54,.14);
    --accent:#FF6B57; --accent2:#13B5A8; --sand:#F2D49B; --soft:#E1F3F0;
    --light:#EAF8F6; --lightmuted:#A9C9D2;
    --ok:#0E9E7A; --ok-bg:#DDF6EE; --bad:#E2483D; --bad-bg:#FDE6E3; --close:#A46B00; --close-bg:#FFF1D2;
    --head:"Gloock",Georgia,serif; --mono:"Martian Mono",ui-monospace,Menlo,monospace; --body:"Schibsted Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--abyss)}
  body{margin:0;color:var(--ink);font:17px/1.6 var(--body);
    background:linear-gradient(180deg,var(--surface) 0,#0C4C6E 520px,var(--mid) 1400px,#06223B 3200px,var(--abyss) 6000px);min-height:100vh;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:screen;
    background:radial-gradient(ellipse 40px 14px at 20% 10%,#fff 0,transparent 70%),radial-gradient(ellipse 60px 18px at 70% 6%,#fff 0,transparent 70%),radial-gradient(ellipse 30px 10px at 45% 16%,#fff 0,transparent 70%);
    animation:caustic 9s ease-in-out infinite alternate}
  @keyframes caustic{to{transform:translate(-30px,12px) scale(1.1)}}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
  button{font:inherit}
  img.emo{width:1.15em;height:1.15em;vertical-align:-.2em}
  .bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bubbles i{position:absolute;bottom:-30px;border:1.5px solid rgba(255,255,255,.45);border-radius:50%;animation:rise linear infinite}
  @keyframes rise{to{transform:translate(var(--dx,20px),-110vh)}}

  /* hero */
  .hero{position:relative;padding:52px 0 18px;color:var(--light)}
  .kicker{display:inline-block;font:500 11.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sand);border:1px solid rgba(242,212,155,.5);padding:5px 12px;border-radius:99px;max-width:calc(100% - 90px)}
  h1{font-family:var(--head);font-weight:400;font-size:clamp(56px,13vw,112px);line-height:.9;margin:16px 0 0;letter-spacing:-.02em;color:#fff}
  h1 em{font-style:normal;color:var(--sand)}
  .sub{color:var(--lightmuted);margin:16px 0 0;max-width:46ch;font-size:18px}
  .depthline{margin-top:20px;display:flex;gap:10px;align-items:center;font:500 11px var(--mono);color:var(--lightmuted);letter-spacing:.08em}
  .depthline::before{content:"";flex:none;width:46px;height:1px;background:var(--lightmuted)}
  .sticker{position:absolute;user-select:none;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 12px 16px rgba(0,0,0,.35))}
  .sticker img{width:100%;height:100%;display:block}
  .s1{right:0;top:40px;width:110px;height:110px;rotate:-8deg}
  .s2{right:110px;top:150px;width:58px;height:58px;rotate:12deg;animation-delay:-3s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}

  /* progress = depth gauge */
  .progress{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:12px;margin:0 -6px;padding:10px 18px;border-radius:99px;font:500 12px var(--mono);color:var(--light);background:rgba(6,34,59,.86);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 26px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .progress .lbl{color:var(--lightmuted);text-transform:uppercase;letter-spacing:.08em}
  .bar{flex:1;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12)}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--sand),var(--accent));transition:width .6s cubic-bezier(.3,1.4,.5,1)}
  .progress .fx{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .progress .fx img{width:18px;height:18px}

  /* parts = depth markers */
  .part{display:flex;align-items:center;gap:16px;margin:64px 0 8px;color:var(--light)}
  .part .pi{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  .part .pi img{width:40px;height:40px}
  .part .pn{font:500 11px var(--mono);letter-spacing:.1em;color:var(--sand)}
  .part h2{font-family:var(--head);font-weight:400;font-size:36px;line-height:1.05;margin:2px 0 0}
  .part p{margin:3px 0 0;color:var(--lightmuted);font-size:15.5px}

  /* cards */
  .card{position:relative;background:var(--paper);border-radius:24px;margin:26px 0;box-shadow:0 18px 40px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.06)}
  .winbar{display:flex;align-items:center;gap:8px;padding:14px 22px 0}
  .winbar i{display:none}
  .winbar span{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--accent2);text-transform:uppercase}
  .card-in{padding:8px 24px 20px}
  .deco{position:absolute;right:18px;top:-28px;width:56px;height:56px;rotate:8deg;user-select:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
  .deco img{width:100%;height:100%}
  .card-head{display:flex;align-items:center;gap:14px}
  .ticket{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font:500 13px var(--mono);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--accent2)}
  .ticket.alt{background:var(--accent);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--sand)}
  h2.t{font-family:var(--head);font-weight:400;font-size:27px;line-height:1.1;margin:0}
  .instr{color:var(--muted);margin:10px 0 18px;font-size:15.5px}
  .instr b{color:var(--ink)}
  .card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{font-weight:600;font-size:15px;border-radius:99px;padding:9px 20px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:transform .12s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
  .btn-check{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-soft{background:var(--soft);border-color:transparent}
  .score{margin-left:auto;font:500 15px var(--mono)}
  .score.perfect{color:var(--ok)}
  .wiggle{animation:wiggle .5s}
  @keyframes wiggle{25%{rotate:-4deg}50%{rotate:4deg}75%{rotate:-2deg}}

  /* theory */
  .rule p{margin:0 0 12px}
  .rule h3{font-family:var(--head);font-weight:400;font-size:21px;margin:22px 0 8px}
  .rule h3:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .box{border-radius:16px;padding:12px 14px;background:var(--soft)}
  .box.pink{background:#FFE9E4}
  .box.sand{background:#FBF0D9}
  .box h4{margin:0 0 4px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .box p{margin:0;font-size:15.5px}
  table.form{width:100%;border-collapse:collapse;font-size:15.5px;margin:10px 0 4px}
  table.form th,table.form td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
  table.form th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .note{margin-top:14px;font-size:15px;background:var(--close-bg);border-radius:14px;padding:10px 14px}
  .notes-tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;background:var(--soft);border-radius:14px;padding:10px 14px}
  .notes-tip img{width:30px;height:30px;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chips span{font:500 12.5px var(--mono);border:1px solid var(--ink);border-radius:99px;padding:3px 11px;background:#fff}
  .colloc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
  .colloc div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15.5px}
  .colloc b{color:var(--accent)}
  .story{font-size:17px;line-height:1.75;background:#fff;border-left:4px solid var(--accent2);border-radius:0 14px 14px 0;padding:14px 18px;margin:8px 0 14px}
  ol.qs{margin:0 0 6px;padding-left:1.4em}
  ol.qs li{margin:0 0 6px}
  details{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
  details summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  details > div{padding:0 14px 12px}
  .hl{background:#FFE0D9;border-radius:4px;padding:0 3px;font-weight:600}
  .hl2{background:#D3F1EC;border-radius:4px;padding:0 3px;font-weight:600}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}}

  /* photos */
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
  .photo{margin:0;border-radius:16px;overflow:hidden;background:#0A3556;position:relative}
  .photo img{display:block;width:100%;height:100%;aspect-ratio:4/3;object-fit:cover}
  .photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;font-size:13.5px;color:#fff;background:linear-gradient(transparent,rgba(4,19,37,.85))}
  .photo figcaption small{display:block;font:400 9.5px var(--mono);opacity:.7;margin-top:2px}
  .photo.wide{grid-column:1/-1}
  .photo.wide img{aspect-ratio:16/8}
  @media (max-width:560px){.photos{grid-template-columns:1fr}}

  /* timeline */
  .tl{position:relative;height:104px;margin:10px 4px 6px}
  .tl::before{content:"";position:absolute;left:0;right:12px;top:52px;height:2px;background:var(--ink)}
  .tl::after{content:"";position:absolute;right:0;top:46px;border-left:13px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
  .tl .now{position:absolute;right:30px;top:44px;width:2px;height:18px;background:var(--muted)}
  .tl .now::after{content:"now";position:absolute;top:22px;left:50%;translate:-50% 0;font:500 10.5px var(--mono);color:var(--muted)}
  .tl .pt{position:absolute;left:var(--x);top:42px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--ink)}
  .tl .pt.e{background:var(--accent)}
  .tl .pt b,.tl .sp b{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;font:500 12px var(--mono);bottom:30px}
  .tl .pt i,.tl .sp i{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;font:400 11px var(--mono);color:var(--muted);font-style:normal;top:30px}
  .tl .sp{position:absolute;left:var(--x);width:var(--w);top:46px;height:13px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--accent2) 0 14px,transparent 14px 22px)}
  .tl .sp b{color:var(--accent2)}
  .tl .stop{position:absolute;left:var(--x);top:34px;height:36px;border-left:2px dashed var(--accent)}
  .tl .stop b{position:absolute;top:-18px;left:4px;white-space:nowrap;font:500 11px var(--mono);color:var(--accent)}

  /* inputs: gaps */
  .lines{margin:0;padding-left:1.7em}
  .lines li::marker{color:var(--accent2);font:500 12px var(--mono)}
  .line{margin:0 0 4px;line-height:2.2}
  .gapwrap{white-space:nowrap}
  .gap{font:inherit;font-size:16.5px;color:var(--ink);border:0;border-bottom:2px solid var(--accent2);background:var(--soft);border-radius:8px 8px 2px 2px;padding:1px 8px;min-width:5ch;max-width:100%;text-align:center;outline:none;transition:background .15s,box-shadow .15s}
  .gap:focus{background:#fff;box-shadow:0 0 0 3px rgba(19,181,168,.25)}
  .hint{color:var(--muted);font:400 .78em var(--mono);margin-left:5px}
  input.ok,textarea.ok{background:var(--ok-bg);border-color:var(--ok);color:#0b5e49}
  input.bad{background:var(--bad-bg);border-color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:4px}
  input.close{background:var(--close-bg);border-color:var(--close)}
  .reveal{display:inline-block;margin-left:6px;font-size:.84em;font-weight:600;color:#0b5e49;background:var(--ok-bg);padding:0 9px;border-radius:99px;line-height:1.9;white-space:nowrap}
  .why{display:block;margin:-2px 0 10px;font-size:14.5px;line-height:1.45;border-radius:10px;padding:6px 10px}
  .why.ok{background:var(--ok-bg);color:#0b5e49}
  .why.bad{background:var(--bad-bg);color:#8a2b2e}

  /* multiple choice */
  .q{margin:0 0 18px}
  .q-text{margin-bottom:8px}
  .q-num{font:500 12px var(--mono);color:var(--accent2);margin-right:8px}
  .blank{display:inline-block;width:60px;border-bottom:2px solid var(--muted);margin:0 3px;translate:0 -4px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-size:15.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:6px 15px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s;text-align:left}
  .opt:hover{border-color:var(--ink)}
  .opt.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  .opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.answer{box-shadow:0 0 0 3px var(--ok)}
  .tf2 .q{padding:12px 0;margin:0;border-bottom:1px solid var(--line)}
  .tf2 .q-top{display:flex;gap:14px;align-items:center;justify-content:space-between}
  .tf2 .q-text{margin:0}
  .tf2 .opts.tfo{flex:none;flex-wrap:nowrap}
  .fixbox{margin:10px 0 0 30px;padding:10px 12px;border-left:3px solid var(--accent);background:#FFF3EF;border-radius:0 12px 12px 0}
  .fixbox .fl{font:500 10.5px var(--mono);color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
  .fixbox .opts{flex-direction:column;align-items:flex-start}
  .warnline{font-size:14px;color:#8a2b2e;margin-top:6px}
  @media (max-width:560px){.tf2 .q-top{flex-direction:column;align-items:flex-start;gap:8px}.fixbox{margin-left:0}}

  /* drag & drop */
  .bank{display:flex;flex-wrap:wrap;gap:9px;padding:12px;min-height:60px;margin-bottom:18px;border:1.5px dashed rgba(11,34,54,.25);border-radius:16px;background:var(--soft);transition:background .15s}
  .bank:empty::before{content:"All placed";color:var(--muted);font-size:14px;align-self:center}
  .bank.over{background:#d0ece7}
  .chip{font-size:15px;font-weight:600;line-height:1.35;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:5px 12px;box-shadow:0 3px 0 var(--accent2);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:left}
  .chip.selected{outline:3px solid var(--accent);outline-offset:2px;rotate:-2deg}
  .chip.dragging{opacity:.28}
  .chip.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;rotate:-4deg;scale:1.05;box-shadow:0 10px 18px rgba(0,0,0,.25)}
  .chip.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:none}
  .chip.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:none}
  .slot{display:inline-flex;align-items:center;justify-content:center;min-width:110px;min-height:40px;padding:2px;margin:0 4px;vertical-align:middle;border:1.5px dashed rgba(11,34,54,.35);border-radius:12px;cursor:pointer;transition:background .15s,border-color .15s}
  .slot .chip{box-shadow:none}
  .slot.over{background:var(--soft);border-color:var(--accent2)}
  .slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
  .slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
  .slot.ok .chip,.slot.bad .chip{background:transparent;border-color:transparent}
  .match{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:.8fr 1.4fr;gap:10px;align-items:center}
  .mrow .left{font-weight:600}
  .mrow .left::before{content:attr(data-n);font:500 12px var(--mono);color:var(--accent2);margin-right:8px}
  .mrow .slot{display:flex;justify-content:flex-start;width:100%;min-height:46px;margin:0}
  @media (max-width:560px){.mrow{grid-template-columns:1fr;gap:6px}.mrow+.mrow{margin-top:8px}}

  /* full inputs */
  .row{margin:0 0 16px}
  .row-label{font-size:14.5px;color:var(--muted);margin-bottom:5px}
  .row-label s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
  .prompt{font-weight:500;margin-bottom:6px}
  .prompt .num{font:500 12px var(--mono);color:var(--accent2);margin-right:8px}
  .key{display:inline-block;font:500 11.5px var(--mono);background:var(--ink);color:#fff;border-radius:99px;padding:2px 10px;margin-left:6px}
  .full{display:block;width:100%;font:inherit;font-size:16.5px;color:var(--ink);padding:10px 14px;border:1.5px solid rgba(11,34,54,.22);border-radius:14px;background:#fff;outline:none;transition:border-color .15s,background .15s}
  .full:focus{border-color:var(--accent2)}
  textarea.full{resize:vertical;min-height:160px;line-height:1.55}
  .model{margin-top:7px;font-size:15px;color:#0b5e49;background:var(--ok-bg);padding:7px 12px;border-radius:12px}
  .model.close{color:#7a5300;background:var(--close-bg)}
  .model.warn{color:#8a2b2e;background:var(--bad-bg)}
  .checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:15px}
  .checks li::before{content:"○";display:inline-block;width:1.4em;font-weight:800;color:var(--muted)}
  .checks li.done::before{content:"✓";color:var(--ok)}
  .checks li.done{color:#0b5e49}
  .wordbox{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .wordbox span{font:500 12px var(--mono);background:var(--soft);border-radius:99px;padding:3px 10px}
  .wordbox span.used{background:var(--ok-bg);color:#0b5e49;text-decoration:line-through}

  /* drill (automaticity) */
  .drill{background:var(--ink);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden}
  .drill .dtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--lightmuted);flex-wrap:wrap}
  .drill .dots{display:flex;gap:5px;flex-wrap:wrap}
  .drill .dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4)}
  .drill .dots i.half{background:linear-gradient(90deg,var(--sand) 50%,transparent 50%);border-color:var(--sand)}
  .drill .dots i.full{background:var(--accent2);border-color:var(--accent2)}
  .drill .timer{font:500 22px var(--mono);color:var(--sand)}
  .drill .dprompt{font-family:var(--head);font-size:clamp(22px,4.6vw,30px);line-height:1.2;margin:22px 0 14px;min-height:2.4em}
  .drill .dprompt small{display:block;font:400 12px var(--mono);color:var(--lightmuted);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
  .drill .drow{display:flex;gap:8px}
  .drill input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;outline:none}
  .drill input:focus{border-color:var(--accent2)}
  .drill .go{background:var(--accent);border:0;color:#fff;border-radius:14px;padding:0 18px;font-weight:700;cursor:pointer}
  .drill .dfb{min-height:26px;margin-top:10px;font-size:15px}
  .drill .dfb.ok{color:#7CF0CF} .drill .dfb.bad{color:#FFB3A8}
  .drill.flash-ok{box-shadow:inset 0 0 0 3px #7CF0CF}
  .drill.flash-bad{animation:shake .35s;box-shadow:inset 0 0 0 3px #FFB3A8}

<script>

(function(){

function norm(s, dWord){

}
function hashStr(s){ let h1 = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ h1 = Math.imul(h1 ^ s.charCodeAt(i), 3432918353); h1 = h1 << 13 | h1 >>> 19; } return h1 >>> 0; }

const pad = i => String(i + 1).padStart(2, "0");

/* ---------- storage ---------- */
const KEY = "lesson:" + LESSON.id;

/* ---------- drag & drop board (mouse + touch + tap) ---------- */
function Board(scope, v){
  const zones = {}, chips = {}; let selected = null;
  const bank = h("div", { class: "bank" });
  register(bank, bank, "bank", false);
  function register(clickEl, dropEl, id, single){
    clickEl.dataset.zone = id; zones[id] = { el: dropEl, box: clickEl, single };
    clickEl.addEventListener("click", () => { if (selected) place(selected, id); });
  }
  function zoneOf(c){ for (const id in zones){ if (zones[id].el === c.parentElement) return id; } return "bank"; }
  function unselect(){ if (selected) selected.classList.remove("selected"); selected = null; }
  function clearMarks(){ scope.querySelectorAll(".ok,.bad").forEach(n => n.classList.remove("ok", "bad")); }
  function place(c, zid, silent){
    const z = zones[zid]; if (!z) return;
    if (z.single) z.el.querySelectorAll(".chip").forEach(o => { if (o !== c) bank.append(o); });
    z.el.append(c); unselect();
    if (!silent){ clearMarks(); for (const id in chips){ const zz = zoneOf(chips[id]); if (zz === "bank") delete v[id]; else v[id] = zz; } persist(); fire(scope); }
  }
  function tap(c){
    if (zoneOf(c) !== "bank"){ place(c, "bank"); return; }
    if (selected === c){ unselect(); return; }

  }
  function zoneAt(x, y){
    const el = document.elementFromPoint(x, y); const z = el && el.closest("[data-zone]");
    return z && scope.contains(z) ? z : null;
  }
  let overEl = null;
  function setOver(z){ if (overEl === z) return; if (overEl) overEl.classList.remove("over"); overEl = z; if (z) z.classList.add("over"); }
  function chip(id, label, value){
    const c = h("button", { class: "chip", type: "button", html: label });
    c.dataset.id = id; c.dataset.value = value; chips[id] = c;
    let d = null;
    c.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      d = { x: e.clientX, y: e.clientY, moved: false, ghost: null };
      try { c.setPointerCapture(e.pointerId); } catch (_) {}
    });
    c.addEventListener("pointermove", e => {

}

/* ---------- renderers: check() returns one value per item: true / false / null (not answered) ---------- */
const RENDER = {};
const LABEL = { mcq: "multiple choice", match: "match", dragwords: "drag & drop", correct: "correct the mistakes", rephrase: "rewrite", write: "writing", drill: "speed drill", rule: "theory", build: "word order", gapfill: "gap fill", tf2: "true / false", slotwrite: "writing", review: "self-check" };
const ROLES = [
  ["who", "Who?"], ["freq", "How often?"], ["does", "Does what?"], ["what", "What? Whom?"], ["where", "Where?"], ["when", "When?"]
];

RENDER.rule = (sec, s, body) => { body.append(h("div", { class: "rule", html: sec.html })); return null; };

RENDER.build = (sec, s, body) => {
  const v = s.v || (s.v = {}); const items = [];
  sec.items.forEach((it, i) => {
    const vi = v[i] || (v[i] = {});
    const wrap = h("div", { class: "bitem" });
    const state = h("span", { class: "bstate" });
    wrap.append(h("div", { class: "bhead" }, h("span", { class: "bnum" }, pad(i)), state));

      if (it[role] == null) return;

    if (it.wrong) chipsData.push({ id: "x", label: it.wrong, value: "x" });

    total: items.length,
    check(){ return items.map(({ slots, state }) => {
      let filled = 0, ok = true;
      slots.forEach(o => {
        const c = o.zone.querySelector(".chip"); if (c) filled++;
        const good = !!c && c.dataset.value === o.role;
        o.box.classList.toggle("ok", good); o.box.classList.toggle("bad", !good);
        if (!good) ok = false;
      });

  };
};

RENDER.gapfill = (sec, s, body) => {
  const v = s.v || (s.v = {}); const lines = [];
  const list = h("ol", { class: "lines" });
  sec.items.forEach((raw, i) => {
    const it = typeof raw === "string" ? { text: raw } : raw;
    const li = h("li", {}); const line = h("div", { class: "line" }); const gaps = [];
    parseGaps(it.text).forEach((p, j) => {
      if (p.text != null){ line.append(h("span", { html: p.text })); return; }
      const key = i + "-" + j;
      const w = Math.max(5, ...p.answers.map(a => a.length)) + 2;
      const input = h("input", { class: "gap", type: "text", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false", "aria-label": p.hint ? "gap: " + p.hint : "gap", style: `width:${w}ch` });

      input.addEventListener("keydown", e => {
        if (e.key !== "Enter") return; e.preventDefault();

  });

    total: lines.length,
    check(){ return lines.map(({ it, li, gaps }) => {
      const old = li.querySelector(".why"); if (old) old.remove();
      if (gaps.every(g => !g.input.value.trim())){ gaps.forEach(g => g.input.classList.remove("ok", "bad")); return null; }
      let ok = true;
      gaps.forEach(g => { const good = matches(g.input.value, g.answers); g.input.classList.toggle("ok", good); g.input.classList.toggle("bad", !good); if (!good) ok = false; });

    }); },
    reveal(){ lines.forEach(({ gaps }) => gaps.forEach(g => { if (!g.input.classList.contains("ok") && !g.wrap.querySelector(".reveal")) g.wrap.append(h("span", { class: "reveal" }, "→ " + g.answers[0])); })); },
    reset(){ clear(v); lines.forEach(({ li, gaps }) => { gaps.forEach(g => { g.input.value = ""; g.input.classList.remove("ok", "bad"); }); const y = li.querySelector(".why"); if (y) y.remove(); }); }
  };
};

RENDER.tf2 = (sec, s, body) => {
  const v = s.v || (s.v = {}); const qs = [];
  body.classList.add("tf2");
  if (sec.text) body.append(h("div", { class: "story", html: sec.text }));
  sec.items.forEach((it, i) => {
    const st = v[i] || (v[i] = {});
    const q = h("div", { class: "q" });
    const tfo = h("div", { class: "opts tfo" });
    const bT = h("button", { class: "opt", type: "button" }, "True");

function similarity(a, b){
  const A = norm(a).split(" ").filter(Boolean), B = norm(b).split(" ").filter(Boolean);
  if (!A.length || !B.length) return 0;
  const pool = B.slice(); let hit = 0;
  for (const w of A){ const i = pool.indexOf(w); if (i > -1){ hit++; pool.splice(i, 1); } }
  return hit / Math.max(A.length, B.length);
}

/* automaticity drill: every item must be typed correctly twice; mistakes come back */
RENDER.drill = (sec, s, body) => {
  const items = sec.items; const NEED = sec.need || 2;
  const box = h("div", { class: "drill" }); body.append(box);
  let q, hits, cur, t0, tick, mistakes;
  function fmt(ms){ const t = Math.floor(ms / 1000); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
  function intro(){
    clearInterval(tick); box.innerHTML = "";
    box.append(h("div", { class: "dtop" }, h("span", {}, items.length + " phrases × " + NEED), h("span", {}, s.best ? "best time " + fmt(s.best) : "no best time yet")));
    box.append(h("div", { class: "dprompt" }, h("small", {}, "how it works"), "Type each answer fast. Mistakes come back until you get them right twice."));
    const go = h("button", { class: "start", type: "button" }, "Start the dive ↓"); go.addEventListener("click", start); box.append(go);
  }
  function start(){
    q = shuffle(items.map((_, i) => i), "d" + Date.now()); hits = items.map(() => 0); mistakes = 0; t0 = Date.now();
    box.innerHTML = "";
    const dots = h("div", { class: "dots" }, items.map(() => h("i")));
    const timer = h("span", { class: "timer" }, "0:00");
    const prompt = h("div", { class: "dprompt" });
    const input = h("input", { type: "text", autocomplete: "off", autocapitalize: "sentences", spellcheck: "false", "aria-label": "your answer" });
    const go = h("button", { class: "go", type: "button" }, "↵");
    const fb = h("div", { class: "dfb" });
    box.append(h("div", { class: "dtop" }, dots, timer), prompt, h("div", { class: "drow" }, input, go), fb);
    tick = setInterval(() => { timer.textContent = fmt(Date.now() - t0); }, 250);
    function paintDots(){ [...dots.children].forEach((d, i) => { d.className = hits[i] >= NEED ? "full" : hits[i] > 0 ? "half" : ""; }); }
    function next(){
      if (!q.length){ finish(); return; }
      cur = q.shift(); const it = items[cur];
      prompt.innerHTML = ""; prompt.append(h("small", {}, it.cue), h("span", { html: it.prompt }));
      input.value = ""; input.focus({ preventScroll: true });
    }
    function submit(){
      if (cur == null || !input.value.trim()) return;
      const it = items[cur]; const ok = matches(input.value, it.answers);
      box.classList.remove("flash-ok", "flash-bad"); void box.offsetWidth; box.classList.add(ok ? "flash-ok" : "flash-bad");
      if (ok){ hits[cur]++; fb.className = "dfb ok"; fb.textContent = "✓ " + it.answers[0]; if (hits[cur] < NEED) q.splice(Math.min(q.length, 3 + Math.floor(Math.random() * 3)), 0, cur); }
      else { mistakes++; hits[cur] = 0; fb.className = "dfb bad"; fb.textContent = "✗ " + it.answers[0]; q.splice(Math.min(q.length, 2), 0, cur); }
      paintDots(); next();
    }
    go.addEventListener("click", submit);
    input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submit(); } });
    paintDots(); next();
  }
  function finish(){
    clearInterval(tick); const ms = Date.now() - t0; const best = !s.best || ms < s.best;
    if (best){ s.best = ms; persist(); }
    box.innerHTML = "";
    const again = h("button", { class: "start", type: "button" }, "Dive again");
    again.addEventListener("click", start);
    box.append(h("div", { class: "done" }, h("small", {}, "your time"), h("b", {}, fmt(ms)),
      h("div", {}, (best ? "New best time! " : "Best: " + fmt(s.best) + ". ") + (mistakes ? mistakes + " slip" + (mistakes > 1 ? "s" : "") + " on the way." : "No mistakes at all!"))), again);
    burst(again);
  }
  intro();
  return { noFoot: true, total: 0 };
};


/* ---------- build page ---------- */
const main = document.getElementById("lesson");
const graded = []; let reviewBox = null; let n = 0;

LESSON.sections.forEach((sec, idx) => {
  if (sec.type === "part"){
    main.append(h("div", { class: "part", style: sec.color ? "--pc:" + sec.color : "" },
      h("div", { class: "pi" }, emo(sec.icon)),
      h("div", {}, h("div", { class: "pn" }, "PART " + sec.n), h("h2", {}, sec.title), sec.text ? h("p", {}, sec.text) : null)));
    return;
  }
  const sid = "s" + idx; const s = SAVE[sid] || (SAVE[sid] = {});
  const exercise = sec.type !== "rule" && sec.type !== "review";
  const card = h("section", { class: "card", id: sid });
  card.append(h("div", { class: "winbar", "aria-hidden": "true" }, h("i"), h("i"), h("i"), h("span", {}, sec.label || LABEL[sec.type] || "")));
  if (sec.sticker) card.append(h("div", { class: "deco", "aria-hidden": "true" }, emo(sec.sticker)));
  const inner = h("div", { class: "card-in" }); card.append(inner);
  const num = exercise ? pad(n++) : (sec.type === "review" ? "★" : "i");
  inner.append(h("div", { class: "card-head" }, h("div", { class: "ticket" + (exercise ? "" : " alt") }, num), h("div", {}, h("h2", { class: "t", html: sec.title || "" }))));
  if (sec.instructions) inner.append(h("p", { class: "instr", html: sec.instructions }));
  else inner.append(h("div", { style: "height:14px" }));
  const body = h("div", { class: "card-body" }); inner.append(body);
  main.append(card);

  if (sec.type === "review"){ reviewBox = body; return; }
  const api = RENDER[sec.type] ? RENDER[sec.type](sec, s, body) : null;
  if (!api || api.noFoot) return;

  const score = h("span", { class: "score" });
  const btnCheck = h("button", { class: "btn btn-check", type: "button" }, "Check");
  const btnShow = h("button", { class: "btn btn-soft", type: "button", hidden: !api.alwaysShow }, api.revealLabel || "👀 Show answers");
  const btnReset = h("button", { class: "btn", type: "button" }, "Reset");
  inner.append(h("div", { class: "card-foot" }, btnCheck, btnShow, btnReset, score));
  const g = { sec, s, api, card, num, title: sec.title };
  graded.push(g);

  function showScore(){
    if (s.score == null || !api.total){ score.textContent = ""; score.classList.remove("perfect"); return; }
    score.textContent = s.score + "/" + api.total + (s.score === api.total ? " ✓" : "");
    score.classList.toggle("perfect", s.score === api.total);
  }
  function doCheck(silent){
    const res = api.check(); const sc = res.filter(x => x === true).length;
    s.score = sc; s.checked = true;
    if (!silent){
      s.tries = (s.tries || 0) + 1;
      s.first = s.first || [];
      s.fixed = s.fixed || [];
      res.forEach((r, i) => {
        if (s.first[i] == null){ if (r !== null) s.first[i] = r; }
        else if (s.first[i] === false && r === true && !s.revealed) s.fixed[i] = true;
      });
    }
    btnShow.hidden = !api.alwaysShow && !((s.tries || 0) >= 2 && sc < api.total);
    persist(); showScore(); updateAll();
    if (!silent && api.total && sc === api.total){ burst(btnCheck); btnCheck.classList.remove("wiggle"); void btnCheck.offsetWidth; btnCheck.classList.add("wiggle"); }
  }
  g.doCheck = doCheck;
  btnCheck.addEventListener("click", () => doCheck(false));
  btnShow.addEventListener("click", () => { s.revealed = true; persist(); api.reveal(); updateAll(); });
  btnReset.addEventListener("click", () => {
    api.reset(); body.querySelectorAll(".reveal,.model,.why").forEach(x => x.remove());
    delete s.score; delete s.checked; persist(); btnShow.hidden = !api.alwaysShow; showScore(); updateAll();
  });
  body.addEventListener("input", () => { if (s.score != null){ delete s.score; delete s.checked; persist(); showScore(); updateAll(); } });
  if (s.checked) doCheck(true);
});

/* ---------- progress + self-check ---------- */
function updateAll(){
  let sc = 0, tot = 0, fixed = 0;
  graded.forEach(({ s, api }) => { tot += api.total; if (s.score != null) sc += s.score; (s.fixed || []).forEach(f => { if (f) fixed++; }); });
  document.getElementById("pScore").textContent = sc;
  document.getElementById("pTotal").textContent = tot;
  document.getElementById("pBar").style.width = tot ? (sc / tot * 100) + "%" : "0";
  document.getElementById("pFix").textContent = fixed;
  if (!reviewBox) return;
  reviewBox.innerHTML = "";
  reviewBox.append(h("div", { class: "fixcount" }, emo("star"),
    h("div", {}, h("div", { class: "big" }, "+" + fixed), h("div", { class: "lbl" }, "mistakes you fixed yourself"))));
  const list = h("div", { class: "rv-list" }); let any = false, checkedAny = false;
  graded.forEach(g => {
    const first = g.s.first || []; if (first.length) checkedAny = true;
    const wrong = [], done = [];
    first.forEach((f, i) => { if (f === false){ (g.s.fixed && g.s.fixed[i] ? done : wrong).push(i + 1); } });
    if (!wrong.length && !done.length) return;
    any = true;
    const btn = h("button", { class: "btn", type: "button" }, wrong.length ? "Fix →" : "See →");
    btn.addEventListener("click", () => { g.card.scrollIntoView({ behavior: "smooth", block: "start" }); g.card.classList.remove("flash"); void g.card.offsetWidth; g.card.classList.add("flash"); });
    list.append(h("div", { class: "rv-item" + (wrong.length ? "" : " done") },
      h("div", {}, h("div", { class: "rv-t" }, g.num + " · " + g.title.replace(/<[^>]+>/g, "")),
        h("div", { class: "rv-n" }, wrong.length ? "to fix: " + wrong.join(", ") + (g.s.revealed ? " (answers shown)" : "") : "all fixed ✓")),
      btn));
  });
  if (!any) list.append(h("div", { class: "rv-empty" }, checkedAny ? "No mistakes — wow! 🎉" : "Check some exercises first. Your mistakes will appear here."));
  reviewBox.append(list);
}
updateAll();

document.getElementById("resetAll").addEventListener("click", () => {
  if (!confirm("Clear all your answers in this lesson?")) return;
  SAVE = {}; try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
});
})();
</script>
