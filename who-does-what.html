<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who does what?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<!-- LESSON TEMPLATE: edit only the LESSON object. Emoji names → assets/emoji/<name>.png -->
<style>
  :root{
    --bg:#F3F4FA; --paper:#FFFFFF; --ink:#14152B; --muted:#6B6E8A;
    --accent:#5B5BF7; --accent2:#FF4F9A; --soft:#E7E8FF;
    --r:#FF4D6D; --g:#22C993; --b:#4D7CFF;
    --ok:#14A374; --ok-bg:#E0F7EE; --bad:#E5484D; --bad-bg:#FDE7E8;
    --close:#B07A06; --close-bg:#FFF3D6;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --head:"Space Grotesk","DM Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);font:17px/1.6 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);
    background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1px,transparent 1.2px);
    background-size:22px 22px}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  button{font:inherit}
  img.emo{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}

  /* RGB stripe */
  .rgb{display:flex;height:8px}
  .rgb i{flex:1}.rgb i:nth-child(1){background:var(--r)}.rgb i:nth-child(2){background:var(--g)}.rgb i:nth-child(3){background:var(--b)}

  /* hero */
  .hero{position:relative;padding:44px 0 16px}
  .kicker{display:inline-block;font:700 12.5px/1.5 var(--mono);letter-spacing:.02em;color:var(--accent);background:var(--paper);border:1.5px solid var(--ink);padding:5px 12px;border-radius:8px;max-width:calc(100% - 90px)}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(46px,10vw,84px);line-height:.95;margin:18px 0 0;letter-spacing:-.035em}
  h1 .cur{display:inline-block;width:.09em;height:.82em;margin-left:.08em;background:var(--accent2);vertical-align:-.04em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  h1 .glitch{background:linear-gradient(90deg,var(--r),var(--g) 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);margin:18px 0 0;max-width:52ch;font-size:18px}
  .sticker{position:absolute;user-select:none;-webkit-user-select:none;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(20,21,43,.18))}
  .sticker img{width:100%;height:100%;display:block}
  .s1{right:0;top:30px;width:96px;height:96px;rotate:10deg}
  .s2{right:92px;top:120px;width:60px;height:60px;rotate:-12deg;animation-delay:-2.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}

  /* progress */
  .progress{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 0;font:700 13.5px var(--mono);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .progress .lbl{color:var(--muted)}
  .bar{flex:1;height:12px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--r),var(--g),var(--b));transition:width .6s cubic-bezier(.3,1.4,.5,1)}

  /* part divider */
  .part{display:flex;align-items:center;gap:14px;margin:56px 0 6px}
  .part .pi{width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:40px}
  .part .pi img{width:54px;height:54px}
  .part .pn{font:700 13px var(--mono);letter-spacing:.08em;color:var(--pc,var(--accent))}
  .part h2{font-family:var(--head);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
  .part p{margin:2px 0 0;color:var(--muted);font-size:15.5px}

  /* window cards */
  .card{position:relative;background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;margin:26px 0;box-shadow:6px 6px 0 var(--ink);overflow:visible}
  .winbar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1.5px solid var(--ink);background:color-mix(in srgb,var(--soft) 55%,#fff);border-radius:16.5px 16.5px 0 0}
  .winbar i{width:11px;height:11px;border-radius:50%;border:1.3px solid var(--ink)}
  .winbar i:nth-child(1){background:var(--r)}.winbar i:nth-child(2){background:#FFC53D}.winbar i:nth-child(3){background:var(--g)}
  .winbar span{margin-left:8px;font:700 11.5px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .card-in{padding:20px 22px 18px}
  .deco{position:absolute;right:16px;top:-26px;width:52px;height:52px;rotate:10deg;user-select:none;font-size:40px;line-height:52px;text-align:center;filter:drop-shadow(0 6px 8px rgba(20,21,43,.18))}
  .deco img{width:100%;height:100%}
  .card-head{display:flex;align-items:flex-start;gap:12px}
  .ticket{flex:none;min-width:44px;height:34px;display:grid;place-items:center;padding:0 9px;background:var(--ink);color:var(--paper);font:700 15px var(--mono);border-radius:8px}
  .ticket.alt{background:var(--accent2)}
  h2.t{font-family:var(--head);font-weight:700;font-size:23px;line-height:1.2;margin:2px 0 0;letter-spacing:-.01em}
  .instr{color:var(--muted);margin:8px 0 18px;font-size:15.5px}
  .instr b{color:var(--ink)}

  .card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
  .btn{font-weight:700;font-size:15px;border-radius:10px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);transition:transform .12s,box-shadow .12s;box-shadow:3px 3px 0 var(--ink)}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn-check{background:var(--accent);color:#fff}
  .btn-soft{background:var(--soft)}
  .score{margin-left:auto;font:700 17px var(--mono)}
  .score.perfect{color:var(--ok)}
  .wiggle{animation:wiggle .5s}
  @keyframes wiggle{25%{rotate:-4deg}50%{rotate:4deg}75%{rotate:-2deg}}

  /* theory blocks */
  .rule p{margin:0 0 12px}
  .rule h3{font-family:var(--head);font-size:18px;margin:22px 0 8px}
  .rule h3:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .box{border-radius:12px;padding:12px 14px;background:var(--soft);border:1.5px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  .box.pink{background:color-mix(in srgb,var(--accent2) 13%,#fff)}
  .box.green{background:color-mix(in srgb,var(--g) 14%,#fff)}
  .box h4{margin:0 0 4px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .box p{margin:0;font-size:15.5px}
  .formula{font:700 clamp(18px,3.6vw,24px) var(--mono);text-align:center;padding:16px 10px;margin:12px 0;border:1.5px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,#fff)}
  .formula .h{color:var(--accent2)}.formula .v{color:var(--accent)}
  table.form{width:100%;border-collapse:collapse;font-size:15.5px;margin:10px 0 4px}
  table.form th,table.form td{border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding:8px 8px;text-align:left;vertical-align:top}
  table.form th{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .hl{background:color-mix(in srgb,var(--accent2) 22%,transparent);border-radius:4px;padding:0 3px;font-weight:700}
  .hl2{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 3px;font-weight:700}
  .note{margin-top:14px;font-size:15px;background:var(--close-bg);border-radius:12px;padding:10px 14px}
  .notes-tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;background:color-mix(in srgb,var(--g) 13%,#fff);border-radius:12px;padding:10px 14px}
  .notes-tip img{width:30px;height:30px;flex:none}
  .cat{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px 10px;margin:14px 0;background:#fff}
  .cat .tag{display:inline-block;font:700 12px var(--mono);background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;margin-bottom:6px}
  .cat p{margin:4px 0}
  .ex{font-style:italic}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chips span{font:700 13.5px var(--mono);border:1.5px solid var(--ink);border-radius:8px;padding:3px 10px;background:#fff}
  .story{font-size:17.5px;line-height:1.8;background:color-mix(in srgb,var(--soft) 45%,#fff);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 18px;margin:8px 0 14px}
  ol.qs{margin:0 0 6px;padding-left:1.4em}
  ol.qs li{margin:0 0 6px}
  details{margin-top:12px;border:1.5px solid var(--ink);border-radius:12px;background:#fff}
  details summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  details > div{padding:0 14px 12px}
  @media (max-width:600px){.grid2{grid-template-columns:1fr}}

  /* timelines */
  .tl{position:relative;height:104px;margin:10px 4px 6px}
  .tl::before{content:"";position:absolute;left:0;right:12px;top:52px;height:3px;background:var(--ink);border-radius:3px}
  .tl::after{content:"";position:absolute;right:0;top:46.5px;border-left:13px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
  .tl .now{position:absolute;right:30px;top:44px;width:3px;height:19px;background:var(--muted);border-radius:2px}
  .tl .now::after{content:"now";position:absolute;top:22px;left:50%;translate:-50% 0;font:700 11.5px var(--mono);color:var(--muted)}
  .tl .pt{position:absolute;left:var(--x);top:43px;width:21px;height:21px;margin-left:-10.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--ink)}
  .tl .pt.e{background:var(--accent2)}
  .tl .pt b,.tl .mk b,.tl .sp b{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;font:700 13px var(--mono);bottom:30px}
  .tl .pt i,.tl .mk i,.tl .sp i{position:absolute;left:50%;translate:-50% 0;white-space:nowrap;font:500 12px var(--mono);color:var(--muted);font-style:normal;top:30px}
  .tl .pt.e b{color:var(--accent2)} .tl .pt b{color:var(--accent)}
  .tl .mk{position:absolute;left:var(--x);top:24px;height:58px;border-left:2.5px dashed var(--accent)}
  .tl .mk b{bottom:auto;top:-22px;color:var(--accent)} .tl .mk i{top:60px}
  .tl .sp{position:absolute;left:var(--x);width:var(--w);top:47px;height:13px;border-radius:7px;background:color-mix(in srgb,var(--accent2) 60%,#fff);border:1.5px solid var(--ink)}
  .tl .sp b{color:var(--accent2)}
  .tl .arc{position:absolute;left:var(--x);width:var(--w);top:6px;height:30px;border:2px dashed var(--muted);border-bottom:0;border-radius:40px 40px 0 0}
  .tl .arc::before{content:"";position:absolute;left:-7px;bottom:-4px;border-top:9px solid var(--muted);border-left:6px solid transparent;border-right:6px solid transparent}
  .tl.big{height:122px}
  .tl.big::before{top:66px}.tl.big::after{top:60.5px}.tl.big .now{top:58px}.tl.big .pt{top:57px}.tl.big .arc{top:12px;height:40px}
  .tl .arc span{position:absolute;top:-13px;left:50%;translate:-50% 0;background:var(--paper);padding:0 6px;font:700 11px var(--mono);color:var(--muted);white-space:nowrap}
  @media (max-width:520px){.tl .pt b,.tl .mk b,.tl .sp b{font-size:11.5px}.tl .pt i,.tl .mk i,.tl .sp i{font-size:10.5px}}

  /* gap fill */
  .lines{margin:0;padding-left:1.6em}
  .lines li::marker{color:var(--accent);font:700 14px var(--mono)}
  .line{margin:0 0 4px;line-height:2.4}
  .para .line{line-height:2.5}
  .gapwrap{white-space:nowrap}
  .gap{font:inherit;font-size:16.5px;color:var(--ink);border:0;border-bottom:2.5px solid var(--accent);background:var(--soft);border-radius:7px 7px 2px 2px;padding:1px 8px;min-width:5ch;max-width:100%;text-align:center;outline:none;transition:background .15s,box-shadow .15s}
  .gap:focus{background:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
  .hint{color:var(--muted);font:500 .8em var(--mono);margin-left:5px}
  input.ok,textarea.ok{background:var(--ok-bg);border-color:var(--ok);color:#0f5f45}
  input.bad{background:var(--bad-bg);border-color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:4px}
  input.close{background:var(--close-bg);border-color:var(--close)}
  .reveal{display:inline-block;margin-left:6px;font-size:.84em;font-weight:700;color:#0f5f45;background:var(--ok-bg);padding:0 9px;border-radius:99px;line-height:1.9;white-space:nowrap}

  /* multiple choice */
  .q{margin:0 0 18px}
  .q-text{margin-bottom:8px}
  .q-num{font:700 14px var(--mono);color:var(--accent);margin-right:8px}
  .blank{display:inline-block;width:60px;border-bottom:2px solid var(--muted);margin:0 3px;translate:0 -4px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-size:15.5px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;transition:transform .12s,background .15s;text-align:left}
  .opt:hover{transform:translateY(-1px)}
  .opt.sel{background:var(--ink);color:#fff}
  .opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.answer{box-shadow:0 0 0 3px var(--ok)}
  .tf .q{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;margin:0;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
  .tf .q-text{margin:0}
  .tf .opts{flex:none;flex-wrap:nowrap}
  @media (max-width:560px){.tf .q{flex-direction:column;align-items:flex-start;gap:8px}}

  /* drag & drop */
  .bank{display:flex;flex-wrap:wrap;gap:9px;padding:12px;min-height:60px;margin-bottom:18px;border:1.5px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:14px;background:color-mix(in srgb,var(--soft) 40%,#fff);transition:background .15s}
  .bank:empty::before{content:"All placed ✨";color:var(--muted);font-size:14px;align-self:center}
  .bank.over{background:var(--soft)}
  .chip{font-size:15px;font-weight:700;line-height:1.35;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;padding:5px 11px;box-shadow:2px 2px 0 var(--accent);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:left}
  .chip.selected{outline:3px solid var(--accent2);outline-offset:2px;rotate:-2deg}
  .chip.dragging{opacity:.28}
  .chip.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;rotate:-4deg;scale:1.05;box-shadow:5px 6px 0 var(--accent)}
  .chip.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:none}
  .chip.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:none}
  .slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:40px;padding:2px;margin:0 4px;vertical-align:middle;border:1.5px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-radius:11px;cursor:pointer;transition:background .15s,border-color .15s}
  .slot .chip{box-shadow:none}
  .slot.over,.bucket-zone.over{background:var(--soft);border-color:var(--accent)}
  .slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
  .slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
  .slot.ok .chip,.slot.bad .chip{background:transparent;border-color:transparent}
  .match{display:grid;gap:10px}
  .mrow{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;align-items:center}
  .mrow .left{font-weight:500}
  .mrow .left::before{content:attr(data-n);font:700 14px var(--mono);color:var(--accent);margin-right:8px}
  .mrow .slot{display:flex;justify-content:flex-start;width:100%;min-height:46px;margin:0}
  @media (max-width:560px){.mrow{grid-template-columns:1fr;gap:6px}.mrow+.mrow{margin-top:8px}}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .bucket{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
  .bucket h3{margin:0;padding:8px 12px;font-size:15px;background:var(--soft);border-bottom:1.5px solid var(--ink)}
  .bucket-zone{min-height:118px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:background .15s}

  /* full-width inputs */
  .row{margin:0 0 16px}
  .row-label{font-size:14.5px;color:var(--muted);margin-bottom:5px}
  .row-label s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
  .prompt{font-weight:500;margin-bottom:6px}
  .prompt .num{font:700 14px var(--mono);color:var(--accent);margin-right:6px}
  .key{display:inline-block;font:700 12.5px var(--mono);background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px;margin-left:6px}
  .full{display:block;width:100%;font:inherit;font-size:16.5px;color:var(--ink);padding:10px 14px;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:11px;background:#fff;outline:none;transition:border-color .15s,background .15s}
  .full:focus{border-color:var(--accent)}
  textarea.full{resize:vertical;min-height:150px;line-height:1.55}
  .model{margin-top:7px;font-size:15px;color:#0f5f45;background:var(--ok-bg);padding:7px 12px;border-radius:10px}
  .model.close{color:#7a5300;background:var(--close-bg)}
  .model.warn{color:#8a2b2e;background:var(--bad-bg)}
  .checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:15px}
  .checks li::before{content:"○";display:inline-block;width:1.4em;font-weight:800;color:var(--muted)}
  .checks li.done::before{content:"✓";color:var(--ok)}
  .checks li.done{color:#0f5f45}
  .wordbox{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .wordbox span{font:700 13px var(--mono);background:var(--soft);border-radius:6px;padding:2px 8px}
  .wordbox span.used{background:var(--ok-bg);color:#0f5f45;text-decoration:line-through}

  .page-foot{text-align:center;padding:24px 0 70px;color:var(--muted);font-size:14px}
  .page-foot .btn{margin-bottom:14px}
  .page-foot small{display:block;margin-top:8px;font-size:12px;opacity:.8}

  .confetti{position:fixed;z-index:999;pointer-events:none;font-size:22px;left:0;top:0;width:28px;height:28px}
  .confetti img{width:100%;height:100%}

  @media (max-width:560px){
    body{font-size:16.5px}
    .card-in{padding:18px 15px 15px}
    .card{box-shadow:4px 4px 0 var(--ink)}
    .s1{width:72px;height:72px;top:24px}
    .s2{display:none}
    .score{width:100%;margin-left:0;order:-1}
    .deco{width:44px;height:44px;top:-20px}
    .gapwrap{white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- word-order slots (fixed colours for the whole lesson) ---- */
  :root{ --sWho:#4D7CFF; --sDoes:#FF4D6D; --sWhat:#14B887; --sWhere:#F09A00; --sWhen:#9B5CFF; --sFreq:#6B6E8A; }
  .c-who{--c:var(--sWho)} .c-does{--c:var(--sDoes)} .c-what{--c:var(--sWhat)} .c-where{--c:var(--sWhere)} .c-when{--c:var(--sWhen)} .c-freq{--c:var(--sFreq)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .legend .lg{flex:1 1 120px;border:2px solid var(--c);border-radius:12px;overflow:hidden;background:#fff;text-align:center}
  .legend .lg b{display:block;background:var(--c);color:#fff;font:700 13px var(--mono);padding:5px 6px}

<script>
/* =====================================================================
   LESSON CONTENT — edit this object to make a new lesson
   ---------------------------------------------------------------------
   build:   { who, freq, does, what, where, when, wrong }  (wrong = extra wrong chip)
   gapfill: items as "text [[answer // hint]]" or { text, why }
   tf2:     { q, answer: true/false, fix: [options], fixAnswer }
   ===================================================================== */
const LESSON = {
  id: "word-order-tenses-01",
  kicker: "// word order + tenses",
  titleHTML: 'Who does <span class="glitch">what</span>?<span class="cur"></span>',
  title: "Who does what?",
  subtitle: "Five slots, six tenses and one little -s.",
  stickers: ["build", "puzzle"],
  confetti: ["star", "party", "sparkles", "100"],
  theme: {
    bg: "#F3F4FA", paper: "#FFFFFF", ink: "#14152B", muted: "#6B6E8A",
    accent: "#5B5BF7", accent2: "#FF4F9A", soft: "#E7E8FF"
  },

  sections: [

    /* ================= 1 · WARM-UP ================= */
    { type: "part", n: "01", icon: "puzzle", color: "var(--r)", title: "Warm-up", text: "Word order: five slots." },

    {
      type: "rule", label: "warm-up · the slots", sticker: "build",
      title: "Every sentence has slots",
      html: `
        <p>Think of a sentence as a train. The carriages always go in <b>the same order</b>.</p>
        <div class="legend">
          <div class="lg c-who"><b>Who?</b><span>I</span></div>
          <div class="lg c-does"><b>Does what?</b><span>do</span></div>
          <div class="lg c-what"><b>What? Whom?</b><span>my homework</span></div>
          <div class="lg c-where"><b>Where?</b><span>in my room</span></div>
          <div class="lg c-when"><b>When?</b><span>every evening</span></div>
        </div>
        <p style="font-size:19px"><span class="w c-who">I</span> <span class="w c-does">do</span> <span class="w c-what">my homework</span> <span class="w c-where">in my room</span> <span class="w c-when">every evening</span>.</p>
        <div class="note">⚠️ <b>Where?</b> comes before <b>When?</b> — place, then time. <b>Does what?</b> is the verb in any tense: <i>do, is doing, did, will do…</i></div>`
    },

    {
      type: "build", label: "warm-up · word order", sticker: "joystick",
      title: "Put it in order",
      instructions: "Tap a word, then tap a slot.",
      items: [
        { who: "I", does: "do", what: "my homework", where: "in my room", when: "every evening" },
        { who: "We", does: "have", what: "lunch", where: "at school", when: "at one o’clock" },
        { who: "They", does: "play", what: "football", where: "in the park", when: "on Saturdays" },
        { who: "I", does: "read", what: "books", where: "in bed", when: "at night" },
        { who: "My friends and I", does: "watch", what: "films", where: "at home", when: "at the weekend" },
        { who: "We", does: "eat", what: "pizza", when: "on Fridays" },
        { who: "I", does: "meet", what: "my grandma", where: "in the city centre" },
        { who: "You", does: "drink", what: "tea", where: "in the kitchen", when: "every morning" },
        { who: "My parents", does: "visit", what: "our cousins", when: "every summer" },
        { who: "We", does: "study", what: "English", where: "at school" }
      ]
    },

    /* ================= 2 · THEORY ================= */
    { type: "part", n: "02", icon: "notebook", color: "var(--g)", title: "Theory", text: "A quick reminder + the tense map." },

    {
      type: "rule", label: "theory · present simple", sticker: "alarm",
      title: "Present Simple — in 30 seconds",
      html: `
        <div class="grid2">
          <div class="box"><h4>when?</h4><p>habits · routines · facts · timetables<br><i>She <b>trains</b> on Tuesdays. Water <b>boils</b> at 100°C.</i></p></div>
          <div class="box pink"><h4>he · she · it → +s</h4><p>work<b>s</b> · watch<b>es</b> · go<b>es</b> · stud<b>ies</b> · <b>has</b></p></div>
        </div>
        <div class="chips"><span>always</span><span>usually</span><span>often</span><span>sometimes</span><span>never</span><span>every day</span><span>on Mondays</span></div>
        <div class="rcard">
          <div><b>Form</b><span>he / she / it + verb-s</span></div>
          <div><b>Use</b><span>habits, routines, facts</span></div>
          <div><b>Examples</b><span>My mum cooks dinner every evening. · I play tennis on Mondays.</span></div>
          <div><b>Trap</b><span><s>She work</s> → She works</span></div>
        </div>
        <div class="notes-tip"><img src="assets/emoji/pencil.png" alt=""><div>Copy the card into your notebook.</div></div>`
    },

    {
      type: "rule", label: "theory · tense map", sticker: "calendar",
      title: "Six tenses, one map",
      html: `
        <div class="tl big">
          <div class="sp" style="--x:2%;--w:20%"><i style="color:var(--accent2);font-weight:700">was playing</i></div>
          <div class="pt e" style="--x:34%"><b>played</b><i>yesterday</i></div>
          <div class="pt" style="--x:59%"><b>is playing</b><i>now</i></div>
          <div class="pt e" style="--x:86%"><b style="white-space:normal;width:76px;text-align:center;line-height:1.2">will / going to</b><i>future</i></div>
        </div>
        <div class="grid2">
          <div class="cat"><span class="tag">Present Simple</span>
            <p><b>V / V-s</b> · habits, facts</p><p class="ex">She plays tennis on Mondays.</p>
            <p style="color:var(--muted);font-size:14px">always, usually, every day</p></div>
          <div class="cat"><span class="tag">Present Continuous</span>
            <p><b>am / is / are + V-ing</b> · happening now</p><p class="ex">She is playing tennis now.</p>
            <p style="color:var(--muted);font-size:14px">now, right now, Look!, at the moment</p></div>
          <div class="cat"><span class="tag">Past Simple</span>
            <p><b>V-ed / V2</b> · finished past · <b>didn’t + V</b></p><p class="ex">She played tennis yesterday.</p>
            <p style="color:var(--muted);font-size:14px">yesterday, last week, ago, in 2020</p></div>
          <div class="cat"><span class="tag">Past Continuous</span>
            <p><b>was / were + V-ing</b> · in progress in the past, background</p><p class="ex">She was playing tennis at 8 pm yesterday.</p>
            <p style="color:var(--muted);font-size:14px">at 8 pm yesterday, while, when</p></div>
          <div class="cat"><span class="tag">will</span>
            <p><b>will + V</b> · decision now, prediction, promise</p><p class="ex">I think she will win.</p>
            <p style="color:var(--muted);font-size:14px">I think, probably, maybe, tomorrow</p></div>
          <div class="cat"><span class="tag">be going to</span>
            <p><b>am / is / are going to + V</b> · plan already made, we can see it coming</p><p class="ex">She is going to play in a match on Saturday.</p>
            <p style="color:var(--muted);font-size:14px">next week, this weekend, Look at…!</p></div>
        </div>
        <div class="grid2">
          <div class="box"><h4>past: background vs event</h4><p><i>I <b>was walking</b> home <b>when</b> it <b>started</b> to rain.</i></p></div>
          <div class="box pink"><h4>will vs going to</h4><p><i>“The phone’s ringing!” — “I<b>’ll</b> get it.”</i> (decision now)<br><i>I<b>’m going to</b> buy a laptop. I’ve saved the money.</i> (plan)</p></div>
        </div>
        <div class="note">⚠️ <b>Traps:</b> <s>She is work</s> → She works / She is working · <s>Yesterday I go</s> → went · <s>Did she went?</s> → Did she go? · <s>I will to go</s> → I will go · <s>I going to</s> → I’m going to</div>
        <div class="notes-tip"><img src="assets/emoji/pencil.png" alt=""><div>Draw the timeline and write one example for each tense.</div></div>`
    },

    /* ================= 3 · FORM ================= */
    { type: "part", n: "03", icon: "laptop", color: "var(--b)", title: "Form practice", text: "Endings and tenses." },

    {
      type: "gapfill", label: "form · -s / -es / -ies", sticker: "search",
      title: "Add the ending",
      instructions: "Write the verb.",
      items: [
        { text: "She [[watches // watch]] TV after dinner.", why: "watch ends in -ch → add -es." },
        { text: "My brother [[plays // play]] computer games.", why: "vowel + y (a + y) → just add -s." },
        { text: "Tom [[studies // study]] maths every day.", why: "consonant + y (d + y) → y becomes -ies." },
        { text: "Our cat [[sleeps // sleep]] on my bed.", why: "most verbs → just add -s." },
        { text: "Dad [[goes // go]] to work by bus.", why: "go ends in -o → add -es." },
        { text: "My sister [[has // have]] long hair.", why: "have is special → it changes to a new word." },
        { text: "Mum [[washes // wash]] the dishes in the evening.", why: "wash ends in -sh → add -es." },
        { text: "He [[does // do]] his homework at six.", why: "do ends in -o → add -es." },
        { text: "The shop [[closes // close]] at nine.", why: "close already ends in -e → just add -s." },
        { text: "Lisa [[fixes // fix]] her bike on Sundays.", why: "fix ends in -x → add -es." }
      ]
    },

    {
      type: "mcq", label: "form · spot the tense", sticker: "eye",
      title: "Which tense is it?",
      instructions: "Look at the <b>bold</b> verb.",
      items: [
        { q: "My brother <b>is playing</b> a computer game right now.", options: ["Present Simple", "Present Continuous", "Past Continuous"], answer: 1 },
        { q: "We <b>went</b> to the seaside last summer.", options: ["Past Simple", "Past Continuous", "Present Simple"], answer: 0 },
        { q: "Look at the sky! It<b>’s going to snow</b>.", options: ["will", "be going to", "Present Continuous"], answer: 1 },
        { q: "She <b>gets up</b> at half past six every morning.", options: ["Present Continuous", "Present Simple", "Past Simple"], answer: 1 },
        { q: "I <b>was sleeping</b> when you called.", options: ["Past Simple", "Past Continuous", "Present Continuous"], answer: 1 },
        { q: "Don’t worry, I<b>’ll help</b> you with maths.", options: ["will", "be going to", "Present Simple"], answer: 0 },
        { q: "They <b>didn’t watch</b> the match yesterday.", options: ["Past Simple", "Present Simple", "Past Continuous"], answer: 0 },
        { q: "<b>Are</b> you <b>listening</b> to me?", options: ["Present Simple", "Present Continuous", "be going to"], answer: 1 },
        { q: "We<b>’re going to paint</b> my room this weekend — we’ve bought the paint.", options: ["will", "be going to", "Present Continuous"], answer: 1 },
        { q: "Water <b>boils</b> at 100°C.", options: ["Present Simple", "Present Continuous", "will"], answer: 0 }
      ]
    },

    {
      type: "gapfill", label: "form · the right tense", sticker: "alarm",
      title: "Choose the tense",
      instructions: "Look at the time words. Write the verb.",
      items: [
        { text: "Look! The cat [[is sleeping|’s sleeping // sleep]] on my laptop.", why: "Look! = now → Present Continuous: am / is / are + -ing." },
        { text: "We [[visited // visit]] our grandparents last Sunday.", why: "last Sunday = finished past → Past Simple." },
        { text: "Lisa usually [[walks // walk]] to school.", why: "usually = routine → Present Simple, and she → -s." },
        { text: "At 8 pm yesterday I [[was watching // watch]] a film.", why: "at 8 pm yesterday = in progress at a past moment → Past Continuous." },
        { text: "“I’m so tired.” — “OK, [[I’ll make|I will make // I / make]] you a cup of tea.”", why: "a decision at the moment of speaking → will + verb." },
        { text: "We’ve got the tickets! We [[are going to see|’re going to see // see]] a concert on Friday.", why: "a plan that is already made → be going to + verb." },
        { text: "While Mum [[was cooking // cook]], the phone rang.", why: "while + background action in the past → Past Continuous." },
        { text: "Max [[didn’t do|did not do // not do]] his homework yesterday.", why: "yesterday + negative → didn’t + base verb (no -ed, no -s)." },
        { text: "[[Does she play // she / play]] the piano?", why: "Present Simple question with he / she / it → Does + base verb (the -s goes to does)." },
        { text: "Look at those black clouds! It [[is going to rain|’s going to rain // rain]].", why: "we can see it coming → be going to." }
      ]
    },

    /* ================= 4 · USE ================= */
    { type: "part", n: "04", icon: "bulb", color: "var(--accent2)", title: "Read & check", text: "True or false?" },

    {
      type: "tf2", label: "use · true or false", sticker: "volleyball",
      title: "Zoe’s week",
      instructions: "Read. True or false? If false — choose the correct sentence.",
      text: "Zoe is sixteen and she loves volleyball. She trains at the sports centre every Tuesday and Thursday. Right now she is sitting on the bus and listening to music. Yesterday she played in a big match, and her team won. While she was running to the net, she fell and hurt her knee, but she didn’t stop. Her coach thinks she will be a great player one day. Next month Zoe is going to visit a volleyball camp in Lviv. Her little brother Max is going to come and watch her.",
      items: [
        { q: "Zoe trains every Monday and Wednesday.", answer: false, fix: ["Zoe trains every Tuesday and Thursday.", "Zoe is training every Tuesday and Thursday.", "Zoe train every Tuesday and Thursday."], fixAnswer: 0 },
        { q: "Right now Zoe is sitting on the bus.", answer: true, fix: ["Right now Zoe sits on the bus.", "Right now Zoe was sitting on the bus.", "Right now Zoe is sitting in a car."], fixAnswer: 0 },
        { q: "Zoe is reading a book on the bus.", answer: false, fix: ["Zoe is listening to music.", "Zoe listens to music now.", "Zoe is listen to music."], fixAnswer: 0 },
        { q: "Yesterday her team lost the match.", answer: false, fix: ["Yesterday her team wins the match.", "Yesterday her team won the match.", "Yesterday her team is winning the match."], fixAnswer: 1 },
        { q: "She fell while she was running to the net.", answer: true, fix: ["She was falling while she ran to the net.", "She falls while she runs to the net.", "She fell while she run to the net."], fixAnswer: 0 },
        { q: "After she hurt her knee, she stopped playing.", answer: false, fix: ["She doesn’t stopped playing.", "She didn’t stopped playing.", "She didn’t stop playing."], fixAnswer: 2 },
        { q: "Her coach thinks she will be a great player.", answer: true, fix: ["Her coach thinks she will is a great player.", "Her coach think she will be a great player.", "Her coach thinks she wills be a great player."], fixAnswer: 0 },
        { q: "Zoe is going to visit a camp in Kyiv.", answer: false, fix: ["Zoe going to visit a camp in Lviv.", "Zoe is going to visit a camp in Lviv.", "Zoe will going to visit a camp in Lviv."], fixAnswer: 1 },
        { q: "Zoe visited the camp last month.", answer: false, fix: ["Zoe is going to visit the camp next month.", "Zoe was visiting the camp next month.", "Zoe visits the camp last month."], fixAnswer: 0 },
        { q: "Max is going to watch her.", answer: true, fix: ["Max is going to play with her.", "Max going to watch her.", "Max watched her last month."], fixAnswer: 0 }
      ]
    },

    /* ================= 5 · MIXED ================= */
    { type: "part", n: "05", icon: "shuffle", color: "var(--accent)", title: "Mixed", text: "Slots + the right tense." },

    {
      type: "build", label: "mixed · order + tense", sticker: "house",
      title: "Build it — choose the verb!",
      instructions: "Look at <b>When?</b> One verb is wrong — leave it out.",
      items: [
        { who: "My mum", does: "cooks", wrong: "is cooking", what: "dinner", where: "in the kitchen", when: "every evening" },
        { who: "My brother", does: "is playing", wrong: "plays", what: "football", where: "in the garden", when: "right now" },
        { who: "We", does: "watched", wrong: "watch", what: "a film", where: "at the cinema", when: "last night" },
        { who: "I", does: "was doing", wrong: "am doing", what: "my homework", where: "in my room", when: "at 8 pm yesterday" },
        { who: "Dad", does: "is going to buy", wrong: "bought", what: "a new car", when: "next month" },
        { who: "Anna", does: "studies", wrong: "study", what: "French", where: "at school", when: "on Wednesdays" },
        { who: "My grandpa", does: "went", wrong: "goes", where: "to the doctor", when: "yesterday" },
        { who: "Our team", does: "will win", wrong: "won", what: "the match", when: "tomorrow" },
        { who: "She", does: "is reading", wrong: "read", what: "a book", where: "on the sofa", when: "now" },
        { who: "They", does: "were playing", wrong: "are playing", what: "tennis", where: "in the park", when: "when it started to rain" }
      ]
    },

    {
      type: "slotwrite", label: "mixed · your sentences", sticker: "pencil",
      title: "Your people",
      instructions: "One sentence each. Use the tense in the box.",
      items: [

        { who: "We", freq: "usually", does: "have", wrong: "has", what: "dinner", where: "in the kitchen", when: "at seven" },
        { who: "Tom", freq: "sometimes", does: "plays", wrong: "play", what: "chess", where: "at school", when: "on Fridays" },

<script>
/* =====================================================================
   ENGINE — no need to edit below this line
   ===================================================================== */
(function(){
"use strict";

function h(tag, props){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (let i = 2; i < arguments.length; i++){
    const kids = [].concat(arguments[i]);
    for (const kid of kids){
      if (kid == null || kid === false || kid === "") continue;
      el.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
  }
  return el;
}
function clear(obj){ for (const k of Object.keys(obj)) delete obj[k]; }
function emo(x){
  if (!x) return "";
  if (/^[a-z0-9-]+$/.test(x)) return h("img", { src: "assets/emoji/" + x + ".png", alt: "", draggable: "false" });
  return document.createTextNode(x);
}
function norm(s, dWord){
  s = String(s || "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”"«»]/g, "");
  s = s.replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "cannot")
       .replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are")
       .replace(/'ve\b/g, " have").replace(/'ll\b/g, " will").replace(/'d\b/g, " " + (dWord || "had"));
  s = s.replace(/[.,!?;:()\[\]–—-]/g, " ").replace(/\s+/g, " ").trim();
  return s;
}
function matches(value, answers){
  const a = answers.map(x => norm(x)); const v1 = norm(value, "had"), v2 = norm(value, "would");
  return v1 !== "" && (a.includes(v1) || a.includes(v2));
}
function parseGaps(str){
  const parts = []; const re = /\[\[(.+?)\]\]/g; let last = 0, m;
  while ((m = re.exec(str))){
    if (m.index > last) parts.push({ text: str.slice(last, m.index) });
    const [ans, hint] = m[1].split(" // ");
    parts.push({ answers: ans.split("|").map(s => s.trim()), hint: hint ? hint.trim() : null });
    last = re.lastIndex;
  }
  if (last < str.length) parts.push({ text: str.slice(last) });
  return parts;
}
function hashStr(s){ let h1 = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ h1 = Math.imul(h1 ^ s.charCodeAt(i), 3432918353); h1 = h1 << 13 | h1 >>> 19; } return h1 >>> 0; }
function shuffle(arr, seedStr){
  let seed = hashStr(seedStr);
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.length > 1 && a.every((x, i) => x === arr[i])) a.push(a.shift());
  return a;
}
function fire(el){ el.dispatchEvent(new Event("input", { bubbles: true })); }
const pad = i => String(i + 1).padStart(2, "0");

/* ---------- storage ---------- */
const KEY = "lesson:" + LESSON.id;
let SAVE = {};
try { SAVE = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { SAVE = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch (e) {} }

/* ---------- header ---------- */
const root = document.documentElement;
for (const k in (LESSON.theme || {})) root.style.setProperty("--" + k, LESSON.theme[k]);
document.title = LESSON.title;
document.getElementById("kicker").textContent = LESSON.kicker || "";
const tEl = document.getElementById("title");
if (LESSON.titleHTML) tEl.innerHTML = LESSON.titleHTML; else tEl.textContent = LESSON.title;
document.getElementById("sub").textContent = LESSON.subtitle || "";
const st = LESSON.stickers || [];
document.getElementById("sticker1").append(emo(st[0]));
document.getElementById("sticker2").append(emo(st[1]));

function burst(fromEl){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = fromEl.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const set = LESSON.confetti && LESSON.confetti.length ? LESSON.confetti : ["⭐"];
  for (let i = 0; i < 16; i++){
    const s = h("span", { class: "confetti" }, emo(set[i % set.length]));
    document.body.append(s);
    const dx = (Math.random() - .5) * 360, dy = -60 - Math.random() * 230, rot = (Math.random() - .5) * 540;
    const anim = s.animate([
      { transform: `translate(${cx}px, ${cy}px) scale(.5)`, opacity: 1 },
      { transform: `translate(${cx + dx * .6}px, ${cy + dy}px) rotate(${rot / 2}deg) scale(1.1)`, opacity: 1, offset: .55 },
      { transform: `translate(${cx + dx}px, ${cy + dy + 170}px) rotate(${rot}deg) scale(.9)`, opacity: 0 }
    ], { duration: 1150 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.4,1)" });
    anim.onfinish = () => s.remove();
  }
}

/* ---------- drag & drop board (mouse + touch + tap) ---------- */
function Board(scope, v){
  const zones = {}, chips = {}; let selected = null;
  const bank = h("div", { class: "bank" });
  register(bank, bank, "bank", false);
  function register(clickEl, dropEl, id, single){
    clickEl.dataset.zone = id; zones[id] = { el: dropEl, box: clickEl, single };
    clickEl.addEventListener("click", () => { if (selected) place(selected, id); });
  }
  function zoneOf(c){ for (const id in zones){ if (zones[id].el === c.parentElement) return id; } return "bank"; }
  function unselect(){ if (selected) selected.classList.remove("selected"); selected = null; }
  function clearMarks(){ scope.querySelectorAll(".ok,.bad").forEach(n => n.classList.remove("ok", "bad")); }
  function place(c, zid, silent){
    const z = zones[zid]; if (!z) return;
    if (z.single) z.el.querySelectorAll(".chip").forEach(o => { if (o !== c) bank.append(o); });
    z.el.append(c); unselect();
    if (!silent){ clearMarks(); for (const id in chips){ const zz = zoneOf(chips[id]); if (zz === "bank") delete v[id]; else v[id] = zz; } persist(); fire(scope); }
  }
  function tap(c){
    if (zoneOf(c) !== "bank"){ place(c, "bank"); return; }
    if (selected === c){ unselect(); return; }
    unselect(); selected = c; c.classList.add("selected");
  }
  function zoneAt(x, y){
    const el = document.elementFromPoint(x, y); const z = el && el.closest("[data-zone]");
    return z && scope.contains(z) ? z : null;
  }
  let overEl = null;
  function setOver(z){ if (overEl === z) return; if (overEl) overEl.classList.remove("over"); overEl = z; if (z) z.classList.add("over"); }
  function chip(id, label, value){
    const c = h("button", { class: "chip", type: "button", html: label });
    c.dataset.id = id; c.dataset.value = value; chips[id] = c;
    let d = null;
    c.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      d = { x: e.clientX, y: e.clientY, moved: false, ghost: null };
      try { c.setPointerCapture(e.pointerId); } catch (_) {}
    });
    c.addEventListener("pointermove", e => {
      if (!d) return;
      if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6){
        d.moved = true; unselect();
        const r = c.getBoundingClientRect(); d.ox = d.x - r.left; d.oy = d.y - r.top;
        d.ghost = c.cloneNode(true); d.ghost.classList.add("ghost"); d.ghost.classList.remove("ok", "bad");
        d.ghost.style.width = r.width + "px"; document.body.append(d.ghost); c.classList.add("dragging");
      }
      if (d.moved){
        e.preventDefault();
        d.ghost.style.left = (e.clientX - d.ox) + "px"; d.ghost.style.top = (e.clientY - d.oy) + "px";
        setOver(zoneAt(e.clientX, e.clientY));
      }
    });
    const end = e => {
      if (!d) return; const was = d; d = null;
      if (!was.moved) return;
      was.ghost.remove(); c.classList.remove("dragging"); setOver(null); c._suppress = true;
      if (e.type === "pointerup"){ const z = zoneAt(e.clientX, e.clientY); if (z) place(c, z.dataset.zone); }
    };
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
    c.addEventListener("click", e => { e.stopPropagation(); if (c._suppress){ c._suppress = false; return; } tap(c); });
    bank.append(c);
    return c;
  }
  function restore(){ for (const id in v){ if (chips[id] && zones[v[id]]) place(chips[id], v[id], true); } }
  function resetAll(){ for (const id in chips) bank.append(chips[id]); clear(v); clearMarks(); unselect(); }
  return { bank, register, chip, place, restore, resetAll, chips, zones, zoneOf };
}

/* ---------- renderers: check() returns one value per item: true / false / null (not answered) ---------- */
const RENDER = {};
const LABEL = { mcq: "multiple choice", rule: "theory", build: "word order", gapfill: "gap fill", tf2: "true / false", slotwrite: "writing", review: "self-check" };
const ROLES = [
  ["who", "Who?"], ["freq", "How often?"], ["does", "Does what?"], ["what", "What? Whom?"], ["where", "Where?"], ["when", "When?"]
];

RENDER.rule = (sec, s, body) => { body.append(h("div", { class: "rule", html: sec.html })); return null; };

RENDER.build = (sec, s, body) => {
  const v = s.v || (s.v = {}); const items = [];
  sec.items.forEach((it, i) => {
    const vi = v[i] || (v[i] = {});
    const wrap = h("div", { class: "bitem" });
    const state = h("span", { class: "bstate" });
    wrap.append(h("div", { class: "bhead" }, h("span", { class: "bnum" }, pad(i)), state));
    const B = Board(wrap, vi);
    const row = h("div", { class: "brow" }); const slots = [];
    ROLES.forEach(([role, q]) => {
      if (it[role] == null) return;
      const zone = h("div", { class: "bz" });
      const box = h("div", { class: "bslot c-" + role, role: "button", "aria-label": q }, h("span", { class: "bq" }, q), zone);
      B.register(box, zone, "z-" + role, true);
      row.append(box); slots.push({ role, box, zone });
    });
    row.append(h("span", { class: "bdot" }, "."));
    const chipsData = ROLES.filter(([r]) => it[r] != null).map(([r]) => ({ id: r, label: it[r], value: r }));
    if (it.wrong) chipsData.push({ id: "x", label: it.wrong, value: "x" });
    shuffle(chipsData, LESSON.id + sec.title + i).forEach(c => B.chip(c.id, c.label, c.value));
    wrap.append(B.bank, row); body.append(wrap);
    B.restore();
    items.push({ B, slots, state });
  });
  return {
    total: items.length,
    check(){ return items.map(({ slots, state }) => {
      let filled = 0, ok = true;
      slots.forEach(o => {
        const c = o.zone.querySelector(".chip"); if (c) filled++;
        const good = !!c && c.dataset.value === o.role;
        o.box.classList.toggle("ok", good); o.box.classList.toggle("bad", !good);
        if (!good) ok = false;
      });
      if (!filled){ slots.forEach(o => o.box.classList.remove("ok", "bad")); state.textContent = ""; return null; }
      state.className = "bstate " + (ok ? "ok" : "bad"); state.textContent = ok ? "✓" : "Try again — fix the red slot.";
      return ok;
    }); },
    reveal(){ items.forEach(({ B, slots }) => { B.resetAll(); slots.forEach(o => B.place(B.chips[o.role], "z-" + o.role)); }); },
    reset(){ items.forEach(({ B, state }) => { B.resetAll(); state.textContent = ""; }); persist(); }
  };
};

RENDER.gapfill = (sec, s, body) => {
  const v = s.v || (s.v = {}); const lines = [];
  const list = h("ol", { class: "lines" });
  sec.items.forEach((raw, i) => {
    const it = typeof raw === "string" ? { text: raw } : raw;
    const li = h("li", {}); const line = h("div", { class: "line" }); const gaps = [];
    parseGaps(it.text).forEach((p, j) => {
      if (p.text != null){ line.append(h("span", { html: p.text })); return; }
      const key = i + "-" + j;
      const w = Math.max(5, ...p.answers.map(a => a.length)) + 2;
      const input = h("input", { class: "gap", type: "text", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false", "aria-label": p.hint ? "gap: " + p.hint : "gap", style: `width:${w}ch` });
      input.value = v[key] || "";
      input.addEventListener("input", () => { v[key] = input.value; persist(); input.classList.remove("ok", "bad"); const y = li.querySelector(".why"); if (y) y.remove(); });
      input.addEventListener("keydown", e => {
        if (e.key !== "Enter") return; e.preventDefault();
        const all = Array.from(body.querySelectorAll("input.gap")); const n = all[all.indexOf(input) + 1];
        if (n) n.focus(); else input.blur();
      });
      const wrap = h("span", { class: "gapwrap" }, input);
      if (p.hint) wrap.append(h("span", { class: "hint" }, "(" + p.hint + ")"));
      line.append(wrap); gaps.push({ input, answers: p.answers, wrap });
    });
    li.append(line); list.append(li); lines.push({ it, li, gaps });
  });
  body.append(list);
  return {
    total: lines.length,
    check(){ return lines.map(({ it, li, gaps }) => {
      const old = li.querySelector(".why"); if (old) old.remove();
      if (gaps.every(g => !g.input.value.trim())){ gaps.forEach(g => g.input.classList.remove("ok", "bad")); return null; }
      let ok = true;
      gaps.forEach(g => { const good = matches(g.input.value, g.answers); g.input.classList.toggle("ok", good); g.input.classList.toggle("bad", !good); if (!good) ok = false; });
      if (it.why) li.append(h("span", { class: "why " + (ok ? "ok" : "bad") }, (ok ? "✓ " : "✗ ") + it.why));
      return ok;
    }); },
    reveal(){ lines.forEach(({ gaps }) => gaps.forEach(g => { if (!g.input.classList.contains("ok") && !g.wrap.querySelector(".reveal")) g.wrap.append(h("span", { class: "reveal" }, "→ " + g.answers[0])); })); },
    reset(){ clear(v); lines.forEach(({ li, gaps }) => { gaps.forEach(g => { g.input.value = ""; g.input.classList.remove("ok", "bad"); }); const y = li.querySelector(".why"); if (y) y.remove(); }); }
  };
};

RENDER.mcq = (sec, s, body) => {
  const v = s.v || (s.v = {}); const qs = [];
  sec.items.forEach((it, i) => {
    const q = h("div", { class: "q" });
    const text = h("div", { class: "q-text" }, h("span", { class: "q-num" }, pad(i)));
    it.q.split("___").forEach((part, k) => { if (k) text.append(h("span", { class: "blank" })); text.append(h("span", { html: part })); });
    const opts = h("div", { class: "opts", role: "radiogroup" });
    const btns = it.options.map((o, j) => {
      const b = h("button", { class: "opt", type: "button", role: "radio", html: o });
      b.addEventListener("click", () => { v[i] = j; persist(); paint(); fire(body); });
      opts.append(b); return b;
    });
    function paint(){ btns.forEach((b, j) => { b.classList.toggle("sel", v[i] === j); b.classList.remove("ok", "bad", "answer"); }); }
    paint(); q.append(text, opts); body.append(q); qs.push({ it, btns, i, paint });
  });
  return {
    total: qs.length,
    check(){ return qs.map(({ it, btns, i, paint }) => { paint(); if (v[i] === undefined) return null; const ok = v[i] === it.answer; btns[v[i]].classList.add(ok ? "ok" : "bad"); return ok; }); },
    reveal(){ qs.forEach(({ it, btns, i }) => { if (v[i] !== it.answer) btns[it.answer].classList.add("answer"); }); },
    reset(){ clear(v); qs.forEach(({ paint }) => paint()); }
  };
};

RENDER.tf2 = (sec, s, body) => {
  const v = s.v || (s.v = {}); const qs = [];
  body.classList.add("tf2");
  if (sec.text) body.append(h("div", { class: "story", html: sec.text }));
  sec.items.forEach((it, i) => {
    const st = v[i] || (v[i] = {});
    const q = h("div", { class: "q" });
    const tfo = h("div", { class: "opts tfo" });
    const bT = h("button", { class: "opt", type: "button" }, "True");
    const bF = h("button", { class: "opt", type: "button" }, "False");
    tfo.append(bT, bF);
    q.append(h("div", { class: "q-top" }, h("div", { class: "q-text" }, h("span", { class: "q-num" }, pad(i)), h("span", { html: it.q })), tfo));
    const fixOpts = h("div", { class: "opts" });
    const fixBtns = it.fix.map((f, j) => { const b = h("button", { class: "opt", type: "button", html: f }); b.addEventListener("click", () => { st.fix = j; persist(); paint(); fire(body); }); fixOpts.append(b); return b; });
    const fixbox = h("div", { class: "fixbox", hidden: true }, h("div", { class: "fl" }, "Correct it:"), fixOpts);
    const warn = h("div", { class: "warnline", hidden: true }, "Choose the correct sentence.");
    q.append(fixbox, warn);
    bT.addEventListener("click", () => { st.tf = true; delete st.fix; persist(); paint(); fire(body); });
    bF.addEventListener("click", () => { st.tf = false; persist(); paint(); fire(body); });
    function paint(){
      [bT, bF, ...fixBtns].forEach(b => b.classList.remove("ok", "bad", "answer"));
      bT.classList.toggle("sel", st.tf === true); bF.classList.toggle("sel", st.tf === false);
      fixbox.hidden = st.tf !== false; warn.hidden = true;
      fixBtns.forEach((b, j) => b.classList.toggle("sel", st.fix === j));
    }
    paint(); body.append(q);
    qs.push({ it, st, bT, bF, fixBtns, fixbox, warn, paint });
  });
  return {
    total: qs.length,
    check(){ return qs.map(o => {
      const { it, st } = o; o.paint();
      if (st.tf === undefined) return null;
      const tfOk = st.tf === it.answer;
      (st.tf ? o.bT : o.bF).classList.add(tfOk ? "ok" : "bad");
      if (st.tf === false && tfOk){
        if (st.fix === undefined){ o.warn.hidden = false; return null; }
        const fixOk = st.fix === it.fixAnswer; o.fixBtns[st.fix].classList.add(fixOk ? "ok" : "bad");
        return fixOk;
      }
      return tfOk;
    }); },
    reveal(){ qs.forEach(o => { const { it, st } = o;
      if (st.tf !== it.answer) (it.answer ? o.bT : o.bF).classList.add("answer");
      if (!it.answer){ o.fixbox.hidden = false; o.fixBtns[it.fixAnswer].classList.add("answer"); }
    }); },
    reset(){ qs.forEach(o => { clear(o.st); o.paint(); }); }
  };
};

RENDER.slotwrite = (sec, s, body) => {
  const v = s.v || (s.v = {}); const rows = [];
  sec.items.forEach((it, i) => {
    const input = h("input", { class: "full", type: "text", autocomplete: "off", autocapitalize: "sentences", spellcheck: "true", placeholder: it.who.split(" / ")[0] + " …", "aria-label": "sentence about " + it.who });
    input.value = v[i] || "";
    const tags = h("div", { class: "sp-tags" },
      h("span", { class: "c-who fill" }, "Who? " + it.who),
      h("span", { class: "c-does" }, "Does what?"), h("span", { class: "c-what" }, "What?"),
      h("span", { class: "c-where" }, "Where?"), h("span", { class: "c-when" + (it.when ? " fill" : "") }, "When?" + (it.when ? " " + it.when : "")));
    if (it.tense) tags.prepend(h("span", { style: "--c:var(--ink)", class: "fill" }, it.tense));
    const row = h("div", { class: "row" }, h("div", { class: "prompt" }, h("span", { class: "num" }, pad(i))), tags, input);
    row.querySelector(".prompt").append(h("span", {}, ""));
    input.addEventListener("input", () => { v[i] = input.value; persist(); input.classList.remove("ok", "bad"); const m = row.querySelector(".model"); if (m) m.remove(); });
    body.append(row); rows.push({ it, input, row });
  });
  return {
    total: rows.length, revealLabel: "👀 Show examples",
    check(){ return rows.map(r => {
      const old = r.row.querySelector(".model"); if (old) old.remove();
      const txt = r.input.value.trim(); if (!txt){ r.input.classList.remove("ok", "bad"); return null; }
      const words = txt.split(/\s+/).filter(Boolean);
      const pat = r.it.pattern || "^\\s*(\\S+\\s+){1,3}\\w*s\\b";
      const verbOk = new RegExp(pat, "i").test(txt.replace(/[’‘]/g, "'"));
      const ok = words.length >= 5 && verbOk;
      r.input.classList.toggle("ok", ok); r.input.classList.toggle("bad", !ok);
      if (!ok) r.row.append(h("div", { class: "model warn" }, !verbOk ? "Check the verb — " + (r.it.need || "he / she / it → -s.") : "Add more slots: what? where? when?"));
      return ok;
    }); },
    reveal(){ rows.forEach(r => { const old = r.row.querySelector(".model"); if (old) old.remove(); r.row.append(h("div", { class: "model" }, "Example: " + r.it.sample)); }); },
    reset(){ clear(v); rows.forEach(r => { r.input.value = ""; r.input.classList.remove("ok", "bad"); }); }
  };
};

/* ---------- build page ---------- */
const main = document.getElementById("lesson");
const graded = []; let reviewBox = null; let n = 0;

LESSON.sections.forEach((sec, idx) => {
  if (sec.type === "part"){
    main.append(h("div", { class: "part", style: sec.color ? "--pc:" + sec.color : "" },
      h("div", { class: "pi" }, emo(sec.icon)),
      h("div", {}, h("div", { class: "pn" }, "PART " + sec.n), h("h2", {}, sec.title), sec.text ? h("p", {}, sec.text) : null)));
    return;
  }
  const sid = "s" + idx; const s = SAVE[sid] || (SAVE[sid] = {});
  const exercise = sec.type !== "rule" && sec.type !== "review";
  const card = h("section", { class: "card", id: sid });
  card.append(h("div", { class: "winbar", "aria-hidden": "true" }, h("i"), h("i"), h("i"), h("span", {}, sec.label || LABEL[sec.type] || "")));
  if (sec.sticker) card.append(h("div", { class: "deco", "aria-hidden": "true" }, emo(sec.sticker)));
  const inner = h("div", { class: "card-in" }); card.append(inner);
  const num = exercise ? pad(n++) : (sec.type === "review" ? "★" : "i");
  inner.append(h("div", { class: "card-head" }, h("div", { class: "ticket" + (exercise ? "" : " alt") }, num), h("div", {}, h("h2", { class: "t", html: sec.title || "" }))));
  if (sec.instructions) inner.append(h("p", { class: "instr", html: sec.instructions }));
  else inner.append(h("div", { style: "height:14px" }));
  const body = h("div", { class: "card-body" }); inner.append(body);
  main.append(card);

  if (sec.type === "review"){ reviewBox = body; return; }
  const api = RENDER[sec.type] ? RENDER[sec.type](sec, s, body) : null;
  if (!api) return;

  const score = h("span", { class: "score" });
  const btnCheck = h("button", { class: "btn btn-check", type: "button" }, "Check");
  const btnShow = h("button", { class: "btn btn-soft", type: "button", hidden: true }, api.revealLabel || "👀 Show answers");
  const btnReset = h("button", { class: "btn", type: "button" }, "Reset");
  inner.append(h("div", { class: "card-foot" }, btnCheck, btnShow, btnReset, score));
  const g = { sec, s, api, card, num, title: sec.title };
  graded.push(g);

  function showScore(){
    if (s.score == null){ score.textContent = ""; score.classList.remove("perfect"); return; }
    score.textContent = s.score + "/" + api.total + (s.score === api.total ? " ✓" : "");
    score.classList.toggle("perfect", s.score === api.total);
  }
  function doCheck(silent){
    const res = api.check(); const sc = res.filter(x => x === true).length;
    s.score = sc; s.checked = true;
    if (!silent){
      s.tries = (s.tries || 0) + 1;
      s.first = s.first || [];
      s.fixed = s.fixed || [];
      res.forEach((r, i) => {
        if (s.first[i] == null){ if (r !== null) s.first[i] = r; }
        else if (s.first[i] === false && r === true && !s.revealed) s.fixed[i] = true;
      });
    }
    btnShow.hidden = !((s.tries || 0) >= 2 && sc < api.total);
    persist(); showScore(); updateAll();
    if (!silent && sc === api.total){ burst(btnCheck); btnCheck.classList.remove("wiggle"); void btnCheck.offsetWidth; btnCheck.classList.add("wiggle"); }
  }
  g.doCheck = doCheck;
  btnCheck.addEventListener("click", () => doCheck(false));
  btnShow.addEventListener("click", () => { s.revealed = true; persist(); api.reveal(); updateAll(); });
  btnReset.addEventListener("click", () => {
    api.reset(); body.querySelectorAll(".reveal,.model,.why").forEach(x => x.remove());
    delete s.score; delete s.checked; persist(); btnShow.hidden = true; showScore(); updateAll();
  });
  body.addEventListener("input", () => { if (s.score != null){ delete s.score; delete s.checked; persist(); showScore(); updateAll(); } });
  if (s.checked) doCheck(true);
});

/* ---------- progress + self-check ---------- */
function updateAll(){
  let sc = 0, tot = 0, fixed = 0;
  graded.forEach(({ s, api }) => { tot += api.total; if (s.score != null) sc += s.score; (s.fixed || []).forEach(f => { if (f) fixed++; }); });
  document.getElementById("pScore").textContent = sc;
  document.getElementById("pTotal").textContent = tot;
  document.getElementById("pBar").style.width = tot ? (sc / tot * 100) + "%" : "0";
  document.getElementById("pFix").textContent = fixed;
  if (!reviewBox) return;
  reviewBox.innerHTML = "";
  reviewBox.append(h("div", { class: "fixcount" }, emo("star"),
    h("div", {}, h("div", { class: "big" }, "+" + fixed), h("div", { class: "lbl" }, "mistakes you fixed yourself"))));
  const list = h("div", { class: "rv-list" }); let any = false, checkedAny = false;
  graded.forEach(g => {
    const first = g.s.first || []; if (first.length) checkedAny = true;
    const wrong = [], done = [];
    first.forEach((f, i) => { if (f === false){ (g.s.fixed && g.s.fixed[i] ? done : wrong).push(i + 1); } });
    if (!wrong.length && !done.length) return;
    any = true;
    const btn = h("button", { class: "btn", type: "button" }, wrong.length ? "Fix →" : "See →");
    btn.addEventListener("click", () => { g.card.scrollIntoView({ behavior: "smooth", block: "start" }); g.card.classList.remove("flash"); void g.card.offsetWidth; g.card.classList.add("flash"); });
    list.append(h("div", { class: "rv-item" + (wrong.length ? "" : " done") },
      h("div", {}, h("div", { class: "rv-t" }, g.num + " · " + g.title.replace(/<[^>]+>/g, "")),
        h("div", { class: "rv-n" }, wrong.length ? "to fix: " + wrong.join(", ") + (g.s.revealed ? " (answers shown)" : "") : "all fixed ✓")),
      btn));
  });
  if (!any) list.append(h("div", { class: "rv-empty" }, checkedAny ? "No mistakes — wow! 🎉" : "Check some exercises first. Your mistakes will appear here."));
  reviewBox.append(list);
}
updateAll();

document.getElementById("resetAll").addEventListener("click", () => {
  if (!confirm("Clear all your answers in this lesson?")) return;
  SAVE = {}; try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
});
})();
</script>
</body>
